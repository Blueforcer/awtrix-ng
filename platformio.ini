; AWTRIX NG - PlatformIO project configuration
;
; Build targets:
;   awtrix          -> ESP32 firmware (default). GPIO pins are runtime config
;                      (web UI, Ulanzi TC001 defaults) - AWTRIX 2 conversions
;                      and DIY builds flash this same image.
;   awtrix_s3       -> ESP32-S3 firmware for generic DIY builds. Same sources,
;                      S3 pin rules and defaults, PSRAM enabled.
;   native          -> host unit tests for the portable core (no hardware)
;   native_sim      -> host simulator: full firmware behaviour + web UI in the
;                      browser, no ESP32 needed (docs/advanced/simulator.md)
;
; The `core/` layer is intentionally Arduino-/FastLED-free portable C++17 so it
; can be unit-tested on the host via the `native` environment.

[platformio]
default_envs = awtrix

; ---------------------------------------------------------------------------
; Shared device configuration (ESP32 firmware builds)
; ---------------------------------------------------------------------------
[device]
framework = arduino
; The partition table is generated per (SoC, flash size) rather than checked in:
; app slots are sized from the firmware, SPIFFS takes the rest. See the script.
extra_scripts =
	pre:scripts/gen_version.py
	pre:scripts/build_webui.py
	pre:scripts/gen_partitions.py
	; core/audio/ builds at -O2 rather than the project's -Os: the MP3 decoder
	; is the one hot loop where the size trade costs real time. Measurements in
	; the script.
	pre:scripts/audio_opt.py
	; Swaps newlib's full formatted I/O for the nano one (~52 KB of flash). Runs
	; post, not pre: it edits the link line the framework builder produces.
	post:scripts/newlib_nano.py
; The platform appends -std=gnu++11 AFTER our build_flags; unflag it so the
; project-wide gnu++17 (portable core) actually applies to device builds too.
build_unflags = -std=gnu++11
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-Wno-attributes
	-std=gnu++17
	-Os
	-fno-exceptions
	; TLS I/O buffers on demand instead of 2x16 KB per connection for its whole
	; lifetime: src/system/tlsdyn/ carries ESP-IDF's CONFIG_MBEDTLS_DYNAMIC_BUFFER
	; layer (v4.4.7 components/mbedtls/port/dynamic, vendored unchanged), which
	; RX-allocates per record at the size the record header announces and frees
	; after use. It is a pure wrapper over the precompiled mbedtls - these flags
	; route the nine entry points through it. Idle HTTPS connection: ~2-4 KB
	; instead of ~33 KB. Do NOT pair with an asymmetric content-length config:
	; the layer sizes RX buffers with tx_buffer_len() (esp-idf #14444).
	-Wl,--wrap=mbedtls_ssl_handshake_client_step
	-Wl,--wrap=mbedtls_ssl_handshake_server_step
	-Wl,--wrap=mbedtls_ssl_read
	-Wl,--wrap=mbedtls_ssl_write
	-Wl,--wrap=mbedtls_ssl_session_reset
	-Wl,--wrap=mbedtls_ssl_free
	-Wl,--wrap=mbedtls_ssl_setup
	-Wl,--wrap=mbedtls_ssl_send_alert_message
	-Wl,--wrap=mbedtls_ssl_close_notify
lib_deps =
	; >=3.9.6 is a hard requirement, not a preference: 3.7.0 added ESP-IDF 5
	; support, 3.9.0 brought the RMT5 driver the IDF5 build selects, and 3.9.6
	; fixed the sticky-first-LED regression in 3.9.5. The old ^3.6.0 floor
	; happened to resolve to a working version; it did not require one.
	fastled/FastLED@^3.9.6
	knolleary/PubSubClient@^2.8
	densaugeo/base64@^1.4.0
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HTU21DF Library@^1.0.5
	adafruit/Adafruit SHT31 Library@^2.2.0

[env:awtrix]
extends = device
platform = espressif32@6.12.0
board = esp32dev
; ScriptHeapNative.cpp is the host/simulator half of the script heap seam; the
; device half is system/ScriptHeapEsp32.cpp. Exactly one may link.
build_src_filter = +<*> -<sim/> -<core/script/ScriptHeapNative.cpp>
build_flags =
	${device.build_flags}

; ---------------------------------------------------------------------------
; Measurement build. Same firmware as `awtrix` plus allocation accounting for
; the loop task, reported through the ordinary log. Never released and not
; built by CI -- it exists because free-heap sampling cannot attribute a cost
; on a device sharing a network with anything else. See src/system/HeapProbe.h.
; ---------------------------------------------------------------------------
; Optimisation is deliberately left at the release -Os: a debug build allocates
; differently, and a measurement of a build nobody runs is worth nothing.
[env:awtrix_probe]
extends = env:awtrix
build_flags =
	${device.build_flags}
	-D AWTRIX_HEAP_PROBE
	; Counting has to see every allocation the loop task makes, including those
	; inside precompiled libraries. Link-time wrapping does that; a header-level
	; override of malloc does not.
	-Wl,--wrap=malloc
	-Wl,--wrap=free
	-Wl,--wrap=calloc
	-Wl,--wrap=realloc

; ---------------------------------------------------------------------------
; ESP32-S3 firmware. Same sources, different SoC: pin rules, the compiled matrix
; drivers and the pin defaults all come from pins::activeProfile(), selected by
; AWTRIX_SOC_ESP32S3. PSRAM is enabled, which is why the heap guards account for
; internal RAM only (src/core/script/ScriptServices.h).
; ---------------------------------------------------------------------------
[env:awtrix_s3]
extends = device
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
; ScriptHeapNative.cpp is the host/simulator half of the script heap seam; the
; device half is system/ScriptHeapEsp32.cpp. Exactly one may link.
build_src_filter = +<*> -<sim/> -<core/script/ScriptHeapNative.cpp>
build_flags =
	${device.build_flags}
	-D AWTRIX_SOC_ESP32S3

; Measurement build for the S3, same terms as awtrix_probe.
[env:awtrix_s3_probe]
extends = env:awtrix_s3
build_flags =
	${device.build_flags}
	-D AWTRIX_SOC_ESP32S3
	-D AWTRIX_HEAP_PROBE
	-Wl,--wrap=malloc
	-Wl,--wrap=free
	-Wl,--wrap=calloc
	-Wl,--wrap=realloc

; ---------------------------------------------------------------------------
; Host unit tests for the portable core (no Arduino / no FastLED)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts =
	pre:scripts/gen_version.py
	pre:scripts/native_toolchain.py
build_flags =
	-std=gnu++17
	-DAWTRIX_NATIVE
	-I src
	; Optimised like the simulator and the firmware. A test binary built at -O0
	; cannot see the bugs the optimiser exposes - a signed overflow folded to a
	; constant in the transition composer is one that already slipped through.
	-O2
; transport/ScriptMqttBridge.cpp is Arduino-free portable logic (subscription
; fan-out, wildcard matching, reconnect replay) and is unit-tested on the host.
; media/GifPlayer.cpp is portable too, but references the per-platform asset
; seam, so test_gifplayer compiles it into its own binary instead of via this
; filter (src objects link into every test, which would demand a readAsset
; stub everywhere).
build_src_filter =
	+<core/>
	+<transport/ScriptMqttBridge.cpp>
lib_deps =
	berry
	densaugeo/base64@^1.4.0
lib_ldf_mode = deep
; base64 declares Arduino-only platforms but compiles fine on native.
lib_compat_mode = off

; ---------------------------------------------------------------------------
; Host simulator: the portable core + a SimBoard + cpp-httplib serving the web
; UI from disk. `pio run -e native_sim`, run .pio/build/native_sim/program,
; open http://localhost:8080. See docs/advanced/simulator.md.
; ---------------------------------------------------------------------------
[env:native_sim]
platform = native
extra_scripts =
	pre:scripts/gen_version.py
	pre:scripts/native_toolchain.py
	post:scripts/native_sim_link.py
build_flags =
	-std=gnu++17
	-DAWTRIX_NATIVE
	-DAWTRIX_SIM
	-I src
	-I src/sim/compat
	-O2
build_src_filter =
	+<core/>
	+<sim/>
	+<media/GifPlayer.cpp>
	+<media/MicroGif.cpp>
	; One icon binding serves both platforms: GifPlayer and icon::draw each have
	; a device and a simulator implementation, so ScriptIcon needs neither.
	+<media/ScriptIcon.cpp>
	+<persistence/DeviceConfigJson.cpp>
	; Shared config-apply + restore-sink base, exercised by the sim's restore
	; endpoint (the device gets them via its +<*> filter).
	+<persistence/SystemConfigApply.cpp>
	+<persistence/FsRestoreSink.cpp>
	+<system/Log.cpp>
	; The device's MQTT stack, compiled unchanged against the Arduino-networking
	; compat shim in src/sim/compat (WiFiClient over a real socket + PubSubClient)
	; so the simulator talks to a real broker exactly like the device does.
	+<transport/ScriptMqttBridge.cpp>
	+<transport/mqtt/MqttService.cpp>
	+<transport/mqtt/MqttLink.cpp>
	+<transport/mqtt/HaAnnouncer.cpp>
	+<transport/DeviceStateJson.cpp>
	; Name resolution is a link-time seam like the script heap: the host half is
	; sim/HostResolverSim.cpp (pulled in by +<sim/> above), the device half is
	; transport/net/HostResolverEsp32.cpp, which this filter deliberately omits.
	; Exactly one may link.
lib_deps =
	densaugeo/base64@^1.4.0
	knolleary/PubSubClient@^2.8
lib_ldf_mode = deep
; base64 declares Arduino-only platforms but compiles fine on native.
lib_compat_mode = off
