name: TC002 installers

on:
  workflow_dispatch:
  # ci.yml calls it on v* tags, after its own image-tools job has uploaded the WASM tools.
  workflow_call:
    inputs:
      image-tools-ready:
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - "tools/tc002/desktop/**"
      - "tools/tc002/browser-image/**"
      - "docs/assets/tc002/**"
      - ".github/workflows/tc002-installer.yml"
      - ".github/workflows/tc002-image-tools.yml"
      - "LICENSE.md"
      - "THIRD-PARTY-NOTICES.md"
  pull_request:
    paths:
      - "tools/tc002/desktop/**"
      - "tools/tc002/browser-image/**"
      - "docs/assets/tc002/**"
      - ".github/workflows/tc002-installer.yml"
      - ".github/workflows/tc002-image-tools.yml"
      - "LICENSE.md"
      - "THIRD-PARTY-NOTICES.md"

permissions:
  contents: read

concurrency:
  group: tc002-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-tools:
    if: ${{ !inputs.image-tools-ready }}
    uses: ./.github/workflows/tc002-image-tools.yml

  packages:
    name: Installer (${{ matrix.target }})
    needs: image-tools
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: none
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/tc002-cargo
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/tc002/desktop/package-lock.json
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tc002-image-tools
          path: docs/assets/tc002/image/
      - name: Install Linux system WebKit build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install the pinned Rust toolchain and Tauri CLI
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 "${{ matrix.target }}"
          npm ci --prefix tools/tc002/desktop
      - name: Test the native USB and download boundaries without hardware
        working-directory: tools/tc002/desktop/native
        run: cargo test --locked --no-default-features --features cli
      - name: Build GUI packages, headless CLI and license/source archives
        working-directory: tools/tc002/desktop
        run: node build.mjs --output "$RUNNER_TEMP/tc002-installer" --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Check the headless entry point without starting USB
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          "$CARGO_TARGET_DIR/${{ matrix.target }}/release/awtrix-tc002-installer-cli$suffix" --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tc002-installer-${{ matrix.target }}
          path: ${{ runner.temp }}/tc002-installer/artifacts/
          if-no-files-found: error
          retention-days: 30
