name: CI

on:
  push:
    branches: [main, "**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A v* tag runs only the release job: it publishes what the successful run on main built and
# tested for the same commit, so push main, wait for it, then tag.
jobs:
  native-tests:
    name: Core host unit tests (native)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Run native unit tests
        run: python scripts/test_native.py

  linux-tests:
    name: Linux application and shared host contracts
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Linux build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liblzma-dev libjpeg-turbo8-dev openssl mosquitto squashfs-tools
          # Ubuntu's AppArmor profile keeps mosquitto out of the temporary folders the tests configure it in.
          if [ -f /etc/apparmor.d/mosquitto ]; then sudo apparmor_parser -R /etc/apparmor.d/mosquitto; fi
          pip install -U platformio
      - name: Resolve shared host libraries
        run: pio pkg install -e native
      - name: Configure the Linux targets
        run: cmake -S . -B .pio/linux -DCMAKE_BUILD_TYPE=Release -DAWTRIX_REQUIRE_INTEGRATION_SERVICES=ON
      - name: Build the Linux targets
        run: cmake --build .pio/linux --parallel 2
      - name: Run Linux contracts
        run: ctest --test-dir .pio/linux --output-on-failure
      - name: Verify actual systemd service isolation and restart persistence
        run: sudo python3 tests/linux/test_service.py --unit .pio/linux/awtrix-ng.service --binary .pio/linux/awtrix-linux --webui webui/index.html

  linux-sanitizers:
    name: Linux contracts under ASan and UBSan
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Linux build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liblzma-dev libjpeg-turbo8-dev openssl mosquitto squashfs-tools
          # Ubuntu's AppArmor profile keeps mosquitto out of the temporary folders the tests configure it in.
          if [ -f /etc/apparmor.d/mosquitto ]; then sudo apparmor_parser -R /etc/apparmor.d/mosquitto; fi
          pip install -U platformio
      - name: Resolve shared host libraries
        run: pio pkg install -e native
      - name: Configure every host target with the sanitizers
        run: cmake -S . -B .pio/linux-sanitize -DCMAKE_BUILD_TYPE=Release -DAWTRIX_SANITIZE=ON -DAWTRIX_REQUIRE_INTEGRATION_SERVICES=ON
      - name: Build the sanitized targets
        run: cmake --build .pio/linux-sanitize --parallel 2
      - name: Run Linux contracts under the sanitizers
        run: ctest --test-dir .pio/linux-sanitize --output-on-failure

  webui-tests:
    name: Web UI tests (jsdom)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/test/package-lock.json
      # The harness loads webui/index.html from disk and tests it in jsdom.
      - name: Install test dependencies
        run: npm ci
        working-directory: webui/test
      - name: Run web UI tests
        run: npm test
        working-directory: webui/test
      - name: Run flow-converter engine tests
        # The converter on the migration page is dependency-free ES modules,
        # so its golden fixtures run on the node this job already has.
        run: node --test "tools/flowconv/*.test.mjs"

  tc002-image-tools:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/tc002-image-tools.yml

  # The TC002 packages are built on every push to main; the release job of a tag takes them
  # from that run.
  tc002-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tc002-update.yml

  device-build:
    name: Firmware build (${{ matrix.env }})
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: awtrix
            ota: firmware-awtrix-ng.bin
          - env: awtrix_s3_octal
            ota: firmware-awtrix-ng-s3-octal.bin
          - env: awtrix_s3_quad
            ota: firmware-awtrix-ng-s3-quad.bin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # scripts/build_webui.py minifies the web UI through npx before it embeds it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        # esptool is not a PlatformIO dependency, but scripts/factory_image.py
        # merges through it (`python -m esptool merge_bin`).
        run: pip install -U platformio esptool
      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
      - name: Build USB install images
        # The full-flash artefact: bootloader, partition table, boot_app0 and the
        # app, one image per flash variant this SoC ships in. Built on every run,
        # not only on tags -- the merge depends on the generated partition table,
        # so a table change that breaks it should fail the PR that made it, not
        # the release three commits later.
        run: python scripts/factory_image.py --env ${{ matrix.env }} --all -o dist
      - name: Stage the OTA image
        # The file a user uploads to /update. One per SoC, and one more for the
        # S3's quad-PSRAM boards, whose PSRAM mode is compiled into the framework
        # libraries rather than detected. These are app images only: OTA writes
        # the app slot and never the partition table, so one file serves every
        # flash size of its chip.
        run: cp .pio/build/${{ matrix.env }}/firmware.bin dist/${{ matrix.ota }}
      - uses: actions/upload-artifact@v4
        with:
          # The release job of a tag publishes these. The USB images' usb- prefix
          # comes from factory_image.asset_name.
          name: firmware-${{ matrix.env }}
          path: |
            dist/usb-*.bin
            dist/${{ matrix.ota }}
          if-no-files-found: error

  docs:
    name: API docs match the firmware
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the check's only dependency
        run: pip install pyyaml
      - name: Check the API docs against the firmware
        # The Docs workflow already runs `mkdocs build --strict`, but that only
        # validates markdown and links. This catches the other half: fields,
        # error codes and removed keys drifting out of sync with the source.
        # It lives here rather than in docs.yml because a release publishes only
        # what a green run of this workflow built.
        run: python tools/check_docs_sync.py
      - name: Check documented error messages and the drift detector
        run: |
          python tools/test_check_error_messages.py
          python tools/check_error_messages.py
      - name: Check the flow converter's maps against the migration tables
        # The converter widget applies the same renames the key-map tables
        # teach by hand, links its warnings at anchors across the docs, and
        # maps TEFF numbers by the row order of the transitions table. Any of
        # those edited without the other side leaves the page and the widget
        # disagreeing at the same scroll position.
        run: python tools/check_flow_converter.py
      - name: Check the downloadable agent skill against its sources
        # The zip the docs offer is committed, so an edit to SKILL.md or to the
        # AI system prompt it packs leaves a stale archive that nothing else
        # notices -- the download keeps working and keeps handing out the old
        # API.
        run: python tools/gen_agent_skill.py --check
      - name: Check the editor's Berry API table against the firmware
        # Same class of drift, different consumer: the web UI editor highlights
        # and completes from a table generated out of the binding registrations.
        # A pattern that stops matching, or a stale checked-in table, both fail
        # silently -- the editor just quietly stops knowing the API.
        run: python tools/check_berry_api.py
      - name: Check the solidified prelude against Prelude.h and the bindings
        # The prelude is compiled to flash-resident const data by a generator no
        # normal build runs, so a stale header is invisible: an edit to
        # Prelude.h simply never reaches the device, and a renamed binding
        # becomes a runtime failure inside the prelude instead of a build error.
        # The fingerprint covers the EXPANDED prelude, so a spliced constant
        # like AWTRIX_MAX_MQTT_SUBS counts even when Prelude.h is untouched.
        run: python tools/check_prelude_solidified.py
      - name: Check the generated panel font against the BDF sources
        # Same shape again: the font header is produced by a generator no build
        # step runs. A stale one keeps drawing the old glyphs, and because which
        # source glyphs get imported is decided by comparing them against their
        # Latin twins, one redrawn base glyph renumbers every index after it.
        run: python tools/check_font_sync.py
      - name: Check shared TC002 package constants
        run: python tools/tc002/install/gen_constants.py --check
      - name: Check every partition table the generator can produce
        # Partition arithmetic looks right in review and bricks a device: an
        # overlap or a misaligned app offset only shows up once someone flashes
        # it. Cheap to check here, expensive to discover in the field.
        run: python tools/check_partitions.py

  release:
    name: Publish firmware release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To read the main run's artifacts, and to dispatch the Docs workflow once
      # the assets exist -- see the last step.
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the version and its release notes
        # The release body only links the release notes page of the docs, so a
        # tag without that page would publish a dead link.
        run: |
          version=$(tr -d '[:space:]' < version)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          [ -f "docs/releases/$version.md" ] || { echo "::error::docs/releases/$version.md is missing"; exit 1; }
          grep -q "releases/$version.md" mkdocs.yml || { echo "::error::docs/releases/$version.md is not in the mkdocs.yml nav"; exit 1; }
          if grep -n -e '-XX' "docs/releases/$version.md" docs/releases/index.md; then echo "::error::the release notes still have no release date"; exit 1; fi
      - name: Fetch what the main run built for this commit
        # The tag publishes the exact files a green run on main built and tested
        # for the same commit: firmware, USB images and the TC002 packages. The
        # firmware version comes from the version file, not the ref, so nothing
        # differs from a rebuild here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$run" ] || { echo "::error::no successful CI run on main for $GITHUB_SHA -- push main, wait for it, then tag"; exit 1; }
          echo "Publishing the artifacts of run $run"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir from-main
      - name: Stage the firmware and the TC002 packages
        # The USB images go into one zip: seven usb-*.bin would drown the three
        # update files on the release page, and the browser flasher picks from
        # inside it (the Docs workflow unpacks it). The update images stay
        # separate assets: the device names the exact file to upload. The TC002
        # desktop installers are not part of a release; they live in
        # installer/tc002.
        run: |
          cp from-main/firmware-*/firmware-awtrix-ng*.bin .
          zip -j usb-awtrix-ng.zip from-main/firmware-*/usb-awtrix-ng-*.bin
          cp from-main/tc002-update/* .
          ls -l firmware-awtrix-ng.bin firmware-awtrix-ng-s3-octal.bin firmware-awtrix-ng-s3-quad.bin \
                awtrix-ng-tc002.awup usb-awtrix-ng-tc002.zip tc002-sources.tar.gz usb-awtrix-ng.zip
      - name: Stage license notices
        # LGPL-2.1 section 6 and the Apache, MIT and BSD terms all require their
        # text to accompany a binary distribution. A release of bare .bin files
        # carries none, so the notices ship as their own asset.
        run: zip -r licenses-awtrix-ng.zip LICENSE.md THIRD-PARTY-NOTICES.md LICENSES/
      - name: Write the release body
        # The release notes live in the docs, one page per version, built per
        # clock. The body only links them.
        run: |
          version=${GITHUB_REF_NAME#v}
          docs=https://blueforcer.github.io/awtrix-ng
          cat > release-body.md <<EOF
          **[Release notes]($docs/releases/$version/)** for your clock:
          [ESP32 (Ulanzi TC001, DIY)]($docs/esp32/releases/$version/) ·
          [ESP32-S3]($docs/esp32-s3/releases/$version/) ·
          [Ulanzi TC002]($docs/tc002/releases/$version/)
          EOF
      - name: Stage the release as a draft
        # Created as a draft on purpose. Publishing fires `release: published`,
        # which is what notifies Discord -- do that before the assets are
        # uploaded and the announcement points at a release with nothing to
        # download for the next few minutes. A draft carries no such event, so
        # the assets land first and the next step flips it live.
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-body.md
          files: |
            firmware-awtrix-ng.bin
            firmware-awtrix-ng-s3-octal.bin
            firmware-awtrix-ng-s3-quad.bin
            awtrix-ng-tc002.awup
            usb-awtrix-ng.zip
            usb-awtrix-ng-tc002.zip
            tc002-sources.tar.gz
            licenses-awtrix-ng.zip
      - name: Flip the release live, now that every asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Announce the release on Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run discord-release.yml --ref main -f tag="$GITHUB_REF_NAME"
      - name: Rebuild the docs so the browser flasher serves this release
        # The flasher on getting-started/flashing.md writes whatever factory
        # images the documentation site carries, and those are copied out of the
        # newest release during the docs build. Without this the site keeps
        # handing out the previous release until someone pushes to main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main
