name: Discord release notification

on:
  release:
    types: [published]

jobs:
  notify:
    name: Post release to Discord
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false && github.event.release.draft == false
    steps:
      - name: Send webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          payload=$(jq -n \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg body "$RELEASE_BODY" \
            '{
              content: ("@everyone New AWTRIX NG release: **\($name)**\n\($url)"),
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: $name,
                url: $url,
                color: 3447003,
                description: (if ($body | length) == 0
                              then "[Release notes](" + $url + ")"
                              elif ($body | length) > 3800
                              then (($body | .[0:3800]) + "\n\n...\n[Full release notes](" + $url + ")")
                              else $body end),
                footer: { text: $tag }
              }]
            }')
          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
