name: Discord release notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to announce, e.g. v1.0.15
        required: true

jobs:
  notify:
    name: Post release to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
            --json name,tagName,url,body,isDraft,isPrerelease)

          if [ "$(jq -r .isDraft <<<"$release")" != "false" ] \
          || [ "$(jq -r .isPrerelease <<<"$release")" != "false" ]; then
            echo "$RELEASE_TAG is a draft or prerelease -- nothing announced."
            exit 0
          fi

          for attempt in $(seq 1 20); do
            assets=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
              --json assets --jq '.assets[] | select(.size > 0) | .name')
            missing=
            for want in firmware-awtrix-ng.bin firmware-awtrix-ng-s3-octal.bin \
                        firmware-awtrix-ng-s3-quad.bin licenses-awtrix-ng.zip; do
              grep -qx "$want" <<<"$assets" || missing="$missing $want"
            done
            # One bundle since v1.0.16; loose usb-*.bin satisfy the check so an
            # older tag can still be re-announced by hand.
            grep -qx 'usb-awtrix-ng.zip' <<<"$assets" || grep -q '^usb-.*\.bin$' <<<"$assets" \
              || missing="$missing usb-awtrix-ng.zip"
            [ -z "$missing" ] && break
            echo "attempt $attempt: still waiting for:$missing"
            [ "$attempt" -eq 20 ] && {
              echo "::error::$RELEASE_TAG has no complete asset set after 5 min -- not announcing:$missing"
              exit 1
            }
            sleep 15
          done
          echo "all assets present, announcing $RELEASE_TAG"

          payload=$(jq -n --argjson r "$release" \
            '($r.name // $r.tagName) as $name |
             {
              content: ("@everyone New AWTRIX NG release: **\($name)**\n\($r.url)"),
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: $name,
                url: $r.url,
                color: 3447003,
                description: (if ($r.body | length) == 0
                              then "[Release notes](" + $r.url + ")"
                              elif ($r.body | length) > 3800
                              then (($r.body | .[0:3800]) + "\n\n...\n[Full release notes](" + $r.url + ")")
                              else $r.body end),
                footer: { text: $r.tagName }
              }]
            }')
          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
