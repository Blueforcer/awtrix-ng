name: Discord release notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to announce, e.g. v1.0.15
        required: true

jobs:
  notify:
    name: Post release to Discord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Highlights from the release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          page="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$page" ]; then python3 tools/docs/release_text.py highlights "$page" > highlights.md; else : > highlights.md; fi
          python3 tools/docs/release_text.py links "${RELEASE_TAG#v}" > links.md
          cat highlights.md links.md
      - name: Send webhook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
            --json name,tagName,url,body,isDraft,isPrerelease)

          if [ "$(jq -r .isDraft <<<"$release")" != "false" ] \
          || [ "$(jq -r .isPrerelease <<<"$release")" != "false" ]; then
            echo "$RELEASE_TAG is a draft or prerelease -- nothing announced."
            exit 0
          fi

          wanted="firmware-awtrix-ng.bin firmware-awtrix-ng-s3-octal.bin firmware-awtrix-ng-s3-quad.bin licenses-awtrix-ng.zip"
          if [ -f packaging/host/windows/installer.nsi ]; then
            wanted="$wanted AWTRIX-Script-Host-windows-x64.exe AWTRIX-Script-Host-macos.pkg"
            wanted="$wanted AWTRIX-Script-Host-Uninstall-macos.pkg"
            for arch in x64 arm64; do
              wanted="$wanted AWTRIX-Script-Host-linux-$arch.tar.gz AWTRIX-Script-Host-linux-$arch.tar.gz.sha256"
            done
          fi

          for attempt in $(seq 1 120); do
            assets=$(gh release view "$RELEASE_TAG" --repo "$REPO" \
              --json assets --jq '.assets[] | select(.size > 0) | .name')
            missing=
            for want in $wanted; do
              grep -qx "$want" <<<"$assets" || missing="$missing $want"
            done
            # One bundle since v1.0.16; loose usb-*.bin satisfy the check so an
            # older tag can still be re-announced by hand.
            grep -qx 'usb-awtrix-ng.zip' <<<"$assets" || grep -q '^usb-.*\.bin$' <<<"$assets" \
              || missing="$missing usb-awtrix-ng.zip"
            [ -z "$missing" ] && break
            echo "attempt $attempt: still waiting for:$missing"
            [ "$attempt" -eq 120 ] && {
              echo "::error::$RELEASE_TAG has no complete asset set after 30 min -- not announcing:$missing"
              exit 1
            }
            sleep 15
          done
          echo "all assets present, announcing $RELEASE_TAG"

          payload=$(jq -n --argjson r "$release" --rawfile highlights highlights.md --rawfile links links.md \
            '($r.name // $r.tagName) as $name |
             ($highlights | rtrimstr("\n")) as $h |
             ($links | rtrimstr("\n")) as $l |
             (if $h == "" then $l else $h + "\n\n" + $l end) as $text |
             {
              content: ("@everyone New AWTRIX NG release: **\($name)**\n\($r.url)"),
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: $name,
                url: $r.url,
                color: 3447003,
                description: (if ($text | length) == 0
                              then "[Release notes](" + $r.url + ")"
                              elif ($text | length) > 3800
                              then (($text | .[0:3800]) + "\n\n...\n[Full release notes](" + $r.url + ")")
                              else $text end),
                footer: { text: $r.tagName }
              }]
            }')
          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
