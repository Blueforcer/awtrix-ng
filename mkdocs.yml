site_name: AWTRIX NG
site_description: AWTRIX NG for ESP32, Ulanzi TC001 and Ulanzi TC002 - user documentation
site_url: https://blueforcer.github.io/awtrix-ng/
repo_url: https://github.com/Blueforcer/awtrix-ng
repo_name: Blueforcer/awtrix-ng
edit_uri: edit/main/docs/
copyright: PolyForm Noncommercial 1.0.0 - Stephan Mühl (Blueforcer)

docs_dir: docs

# The AI system prompt is not a page of its own -- guides/ai-prompt.md embeds it
# as a snippet and links the raw file for download. The flow converter's
# package.json only marks its directory as ESM for the node-run tests.
exclude_docs: |
  examples/berry-app-system-prompt.md
  assets/flow-converter/package.json
  assets/tc002/package.json


not_in_nav: |
  assets/tc002/image/NOTICE.md
  assets/tc002/image/licenses/*.md

# Every page is in the navigation; with --strict a page left out of it fails the build.
validation:
  nav:
    omitted_files: warn

theme:
  name: material
  custom_dir: overrides
  font:
    text: Archivo
    code: IBM Plex Mono
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra:
  kofi: https://ko-fi.com/blueforcer

extra_css:
  - assets/theme.css
  - assets/flow-converter/converter.css
  - assets/tc002/ui.css
  - assets/nav.css
  - assets/buy.css
  - assets/home.css

extra_javascript:
  - assets/variant.js
  - assets/home.js
  - assets/scripting-anchors.js

hooks:
  - tools/docs/variants.py

plugins:
  - search
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets: { base_path: [docs, .], check_paths: true }

