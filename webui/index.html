<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWTRIX NG</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 19 19'%3E%3Crect width='19' height='19' rx='4' fill='%230d1117'/%3E%3Cpath fill='%23262c36' d='M2 2h3v3H2zM14 2h3v3h-3zM6 6h3v3H6zM10 6h3v3h-3zM6 14h3v3H6zM10 14h3v3h-3z'/%3E%3Cpath fill='%23fff' d='M6 2h3v3H6zM10 2h3v3h-3zM2 6h3v3H2zM14 6h3v3h-3zM2 10h3v3H2zM6 10h3v3H6zM10 10h3v3h-3zM14 10h3v3h-3zM2 14h3v3H2zM14 14h3v3h-3z'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117;--card:#161b22;--card2:#1c2129;--border:#2d333b;--brd2:#21262d;--fg:#e6edf3;
  --dim:#8b949e;--acc:#58a6ff;--pri:#1f6feb;--ok:#3fb950;--err:#f85149;--warn:#d29922;
  --errbrd:#6e2a28;--bnw:#3b2e12;--bna:#122a44;--badbg:#42191a;--badfg:#ffdad6;
  --con:#010409;--sh:#0009;--trk:var(--border);
  --tkw:#ff7b72;--tapi:#ffa657;--tcore:#d2a8ff;--tstr:#a5d6ff;--tnum:#79c0ff;
  --tcom:#8b949e;--top:#b1bac4;--tsel:#2d4f76;--tselo:rgba(45,79,118,.45);--tcur:#1f242c;
  --r:10px;font-size:16px;
  --f1:11px;
  --f2:19px;
  --mono:ui-monospace,Consolas,monospace;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#fff;--card:#f6f8fa;--card2:#eaeef2;--border:#d0d7de;--brd2:#d8dee4;--fg:#1f2328;
  --dim:#59636e;--acc:#0969da;--pri:#0969da;--ok:#1a7f37;--err:#cf222e;--warn:#9a6700;
  --errbrd:#ffcecb;--bnw:#fff8c5;--bna:#ddf4ff;--badbg:#ffebe9;--badfg:#82071e;
  --con:#f6f8fa;--sh:#0002;--trk:#8c959f;
  --tkw:#cf222e;--tapi:#953800;--tcore:#8250df;--tstr:#0a3069;--tnum:#0550ae;
  --tcom:#59636e;--top:#24292f;--tsel:#b6d9ff;--tselo:rgba(137,198,255,.4);--tcur:#f0f3f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg)}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:70px}
a{color:var(--acc);text-decoration:none}
h1{font-size:17px;font-weight:600}
h2{font-size:15px;font-weight:600;margin-bottom:2px}
button{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--border);
  border-radius:7px;padding:7px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default;border-color:var(--border)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.danger{color:var(--err);border-color:var(--errbrd)}
button.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
button.icon{padding:7px 10px}
button.icon.kofi{background:#00b9fe;border-color:#00b9fe;height:36px;display:inline-flex;align-items:center;justify-content:center}
button.icon.kofi:hover{border-color:#00b9fe;filter:brightness(1.08)}
.kofilogo{width:18px;height:18px;flex:none}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.switch input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
input[type=checkbox]{width:auto}
input[type=color]{height:34px;flex:none;cursor:pointer}
.cpick{position:relative;display:inline-flex;flex:none}
.cpick input[type=color]{width:86px;padding:0;border:0;background:none;overflow:hidden}
.cpick input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cpick input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
.cpick input[type=color]::-moz-color-swatch{border:0;border-radius:7px}
.cpick .chex{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:11.5px/1 var(--mono);letter-spacing:.02em;pointer-events:none;border-radius:7px;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.42)}
.cpick:focus-within .chex{box-shadow:inset 0 0 0 2px var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc);border:none;background:none}
input[type=file]{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg)}
.topbar>header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--bg)}
.topbar>header .lg{width:21px;height:21px;flex:none}
.topbar>header h1.off{color:var(--err)}
nav{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--bg)}
nav a{padding:8px 13px;border-radius:8px 8px 0 0;color:var(--dim);white-space:nowrap}
nav a.on{color:var(--fg);background:var(--card);border:1px solid var(--border);border-bottom-color:var(--card)}
main{max-width:1060px;margin:0 auto;padding:16px;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
main>.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.card .ghelp{color:var(--dim);font-size:12.5px;margin-top:-6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.settings{grid-column:1/-1;display:grid;grid-template-columns:180px minmax(0,760px);gap:22px;justify-content:center}
.subnav{position:sticky;top:var(--chrome-h,104px);align-self:start;display:grid;gap:1px;padding-top:4px}
.subnav a{padding:7px 12px;border-radius:7px;color:var(--dim);font-size:13px;cursor:pointer;border-left:2px solid transparent}
.subnav a:hover{color:var(--fg)}
.subnav a.on{color:var(--fg);background:var(--card2);border-left-color:var(--acc);border-radius:0 7px 7px 0}
.panel{display:grid;gap:14px;min-width:0;padding-bottom:76px}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--r);scroll-margin-top:calc(var(--chrome-h,104px) + 6px)}
.section>header{padding:13px 18px 11px;border-bottom:1px solid var(--border);
  background:var(--card2);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.section>header .ghelp{color:var(--dim);font-size:12.5px;margin-top:2px}
.section .rows{padding:2px 18px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--brd2)}
.frow:last-child{border-bottom:none}
.frow .lab{display:grid;gap:2px;min-width:0}
.frow .lab .l1{display:flex;align-items:baseline;gap:8px}
.frow .lab b{font-weight:500;font-size:13.5px}
.frow .key{font:10.5px ui-monospace,Consolas,monospace;color:var(--dim);opacity:.7}
.frow .help{color:var(--dim);font-size:12px;max-width:52ch}
.frow .ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.unitwrap{position:relative;display:inline-flex;align-items:center}
.unitwrap .unit{position:absolute;right:9px;color:var(--dim);font-size:12px;pointer-events:none;
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unitwrap input[type=number]{padding-right:min(calc(var(--ul) + 16px),58px)}
.frow .ctl input[type=number]{-moz-appearance:textfield}
.frow .ctl input[type=number]::-webkit-outer-spin-button,
.frow .ctl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.frow .ctl input[type=text],.frow .ctl input[type=password],.frow .ctl select{width:240px}
.frow .ctl input[type=number]{width:110px}
.frow .ctl input[type=range]{width:190px}
.frow .val{color:var(--dim);font-size:12px;min-width:38px;text-align:right}
.frow.full{grid-template-columns:1fr}
.frow.full .ctl{justify-content:flex-start}
.tzctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tzrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tzprev{color:var(--dim);font-size:12px;text-align:right}
.days{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.daybox{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid var(--trk);
  border-radius:6px;cursor:pointer;font-size:12px;user-select:none}
.daybox input{margin:0;cursor:pointer}
.daybox:has(input:checked){border-color:var(--acc);color:var(--acc)}
.daybox:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.wifiwrap{position:relative;width:240px}
.frow .ctl .wifiwrap input[type=text]{width:100%;padding-right:28px}
.wificaret{position:absolute;top:0;right:0;height:100%;width:26px;display:flex;
  align-items:center;justify-content:center;border:none;background:transparent;
  color:var(--dim);cursor:pointer;font-size:11px;padding:0}
.wifimenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  box-shadow:0 8px 24px var(--sh);max-height:210px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wifimenu[hidden]{display:none}
.wifiopt{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 11px;cursor:pointer;font-size:13px}
.wifiopt+.wifiopt{border-top:1px solid var(--border)}
.wifiopt:hover{background:var(--pri);color:#fff}
.wifiopt .g{color:var(--dim);font-size:12px;white-space:nowrap}
.wifiopt:hover .g{color:#fff9}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--card2);border-top:1px solid var(--acc);box-shadow:0 -6px 18px var(--sh)}
#savebar .n{color:var(--acc);font-weight:600}
.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;border-radius:11px;background:var(--trk);transition:background .15s}
.switch i:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i:before{left:21px}
.banner{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--bnw);border:1px solid var(--warn);
  border-radius:var(--r);padding:10px 14px}
.banner.blue{background:var(--bna);border-color:var(--acc)}
.banner.rbstick{position:sticky;top:var(--chrome-h,104px);z-index:19;box-shadow:0 4px 14px var(--sh)}
.banner .bx{flex:none;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:3px 7px;border-radius:6px}
.banner .bx:hover{background:var(--card2);color:var(--fg)}
.captive-hint{display:none;gap:4px 8px;flex-wrap:wrap;font-size:12.5px}
.captive-hint a{color:var(--acc);font-weight:600;white-space:nowrap}
#toasts{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:99;width:min(92vw,420px)}
.toast{padding:10px 14px;border-radius:8px;background:var(--card2);border:1px solid var(--ok);box-shadow:0 4px 16px var(--sh);
  font-size:13px;word-break:break-word;animation:tin .18s}
.toast.err{border-color:var(--err)}
.toast .tacts{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
.toast .tacts button{padding:5px 12px;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ic{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.hero{grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
canvas#screen{display:block;width:100%;aspect-ratio:4/1;image-rendering:pixelated;background:#000}
.hctl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);flex-wrap:wrap}
.hctl .lab{font-size:var(--f1);color:var(--dim)}
.hctl input[type=range]{flex:1;min-width:110px;width:auto}
.hctl .val{font:var(--f1)/1 var(--mono);color:var(--dim);min-width:26px;text-align:right}
.vitals{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.vit{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;
  display:grid;gap:5px;align-content:start}
.vit .k{font-size:var(--f1);color:var(--dim);display:flex;align-items:center;gap:5px;min-width:0}
.vit .k span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vit .v{font:500 var(--f2)/1.1 var(--mono);display:flex;align-items:baseline;gap:2px}
.vit .v u{font-size:var(--f1);color:var(--dim);text-decoration:none}
.vit .b{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.vit .b i{display:block;height:100%;border-radius:2px}
.vit .s{font:var(--f1)/1.2 var(--mono);color:var(--dim)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px 16px;padding:8px 11px;
  border:1px solid var(--border);border-radius:8px;font:var(--f1)/1.4 var(--mono);color:var(--dim)}
.meta b{color:var(--fg);font-weight:400}
.grid-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.tile{position:relative;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 4px 14px var(--sh)}
.tile .pw{position:relative;aspect-ratio:1;background:#000;box-shadow:inset 0 0 0 1px #ffffff10}
.tile .pw img{width:100%;height:100%;padding:12%;object-fit:contain;image-rendering:pixelated;display:block}
.tile .ft{display:flex;align-items:baseline;gap:6px;padding:7px 9px;min-width:0}
.tile .ft .nm{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ft .sz{flex:none;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tile .acts{position:absolute;inset:0 0 auto 0;display:flex;justify-content:flex-end;gap:5px;padding:6px;
  background:linear-gradient(#000b,#0000);opacity:0;pointer-events:none;transition:opacity .15s}
.tile:hover .acts,.tile:focus-within .acts{opacity:1;pointer-events:auto}
@media(hover:none){.tile .acts{opacity:1;pointer-events:auto}}
.tile .acts button{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;
  padding:4px 6px;font-size:12px;background:#0d1117d9;border:1px solid #ffffff26;border-radius:7px;color:#e6edf3}
.tile .acts button:hover{border-color:var(--acc)}
.tile .acts button.danger{color:#f85149}
.tile .acts button.armed{background:var(--err);border-color:var(--err);color:#fff}
.tile .acts .ic{width:15px;height:15px}
.orsep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.07em}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--border)}
.lam{display:grid;gap:10px}
.lam .prev{width:52px;height:52px;flex:none;image-rendering:pixelated;background:#000;border-radius:6px}
.empty{grid-column:1/-1;padding:24px 12px;text-align:center;color:var(--dim);font-size:13px;
  border:1px dashed var(--border);border-radius:10px}
.drop{border:2px dashed var(--border);border-radius:var(--r);padding:22px;text-align:center;color:var(--dim);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.drop:hover{border-color:var(--acc);color:var(--fg)}
.drop.over{border-color:var(--acc);color:var(--acc);background:#58a6ff11}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .2s}
.bar>i.hot{background:var(--err)}
.storage .lbl{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
.console{background:var(--con);border:1px solid var(--border);border-radius:8px;padding:10px;height:60vh;overflow:auto;
  font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.mono{font:12px ui-monospace,Consolas,monospace;color:var(--dim)}
.palwrap{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,304px) minmax(0,1fr);
  gap:14px;align-items:start}
.palhd{display:flex;align-items:center;gap:8px}
.palhd h2{flex:0 1 auto}
.palhd .chev{display:none;color:var(--dim);flex:none;margin-left:auto}
.palhd .chev .ic{width:18px;height:18px}
.palbody{display:grid;gap:10px}
.ramp{display:block;width:100%;height:13px;border-radius:4px;border:1px solid var(--border)}
.pallist{display:grid;gap:3px}
.pallist .grp{display:flex;align-items:baseline;gap:7px;padding:13px 2px 5px;
  font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.pallist .grp:first-child{padding-top:0}
.palrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;align-items:center;
  background:var(--card2);border:1px solid transparent;border-radius:8px;padding:6px 8px;
  cursor:pointer;transition:border-color .12s,background .12s}
.palrow:hover{border-color:var(--border)}
.palrow:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.palrow.on{border-color:var(--acc);background:var(--bna)}
.palrow .l1{display:flex;align-items:baseline;gap:7px;min-width:0}
.palrow .nm{font:12.5px var(--mono);word-break:break-all;min-width:0}
.palrow .tag{flex:none;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.palrow .acts{display:flex;gap:4px}
.palrow .ramp{grid-column:1/-1;height:15px}
.palhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.palhead>input{flex:1;min-width:150px}
.palcount{flex:none;font:11.5px var(--mono);color:var(--dim)}
.palcount.max{color:var(--warn)}
.ramp.big{height:54px;border-radius:8px}
.palbl{display:flex;align-items:center;gap:8px;flex:none}
.palnote{color:var(--dim);font-size:12px;margin-top:-4px}
.palnote:empty{display:none}
.palbar{position:relative;padding-bottom:19px;touch-action:none}
.palhandles{position:absolute;left:0;right:0;bottom:0;height:19px}
.palh{position:absolute;top:0;transform:translateX(-50%);width:19px;height:19px;padding:0;
  background:none;border:none;border-radius:0;cursor:grab;display:flex;justify-content:center}
.palh>i{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--fg);
  box-shadow:0 0 0 1px var(--bg),0 1px 3px var(--sh);transition:transform .1s}
.palh::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-bottom-color:var(--fg)}
.palh:hover>i{transform:scale(1.12)}
.palh.on>i{border-color:var(--acc);transform:scale(1.25)}
.palh.on::before{border-bottom-color:var(--acc)}
.palh.drag{cursor:grabbing}
.palh:focus{outline:none}
.palh:focus-visible>i{outline:2px solid var(--acc);outline-offset:2px}
.palsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.palsel input[type=color]{height:32px}
.palsel input[type=number]{flex:0 0 68px;width:68px}
.palsel .pl{flex:none}
.palbad{grid-column:1/-1;font-size:12px;color:var(--err)}
.uplist{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.piskelwrap{grid-column:1/-1;position:relative;overflow:hidden;background:var(--con);
  border:1px solid var(--border);border-radius:var(--r);
  height:calc(100dvh - var(--chrome-h,104px) - 88px);min-height:400px}
.piskelwrap iframe{width:100%;height:100%;border:0;display:block}
.piskelload{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
  color:var(--dim);background:var(--con)}
.piskelload .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);

<script>
'use strict';
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null)continue;
    if(k==='class')n.className=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='disabled'||k==='selected'){if(v)n[k]=true;}
    else if(k==='value')n.value=v;
    else n.setAttribute(k,v);
  }
  for(const k of kids.flat(9)){if(k==null)continue;n.append(k.nodeType?k:String(k));}
  return n;
}
function toast(msg,ok=true,actions){
  const d=el('div',{class:'toast'+(ok?'':' err')},msg);
  if(actions&&actions.length){
    d.append(el('div',{class:'tacts'},...actions.map(a=>{
      const b=el('button',{class:a.pri?'pri':''},a.label);
      b.addEventListener('click',()=>{d.remove();a.fn();});
      return b;
    })));
  }else setTimeout(()=>d.remove(),ok?3000:6000);
  $('#toasts').append(d);
  return d;
}
let netOk=true;
function setNet(ok){
  if(ok===netOk)return;
  netOk=ok;$('#brand').classList.toggle('off',!ok);
}
async function api(path,opts={}){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),opts.timeout||12000);
  let r;
  try{r=await fetch(path,{signal:ctrl.signal,...opts});}
  catch(e){clearTimeout(to);setNet(false);throw new Error(t('neterr'));}
  clearTimeout(to);setNet(true);
  const text=await r.text();
  let data=text;try{data=JSON.parse(text);}catch(e){}
  if(!r.ok&&r.status!==202){
    const err=data&&data.error;
    const e=new Error(err?(err.message||err.code)+(err.field?' ('+err.field+')':''):'HTTP '+r.status);
    e.status=r.status;e.code=err&&err.code;
    throw e;
  }
  return{status:r.status,data,text};
}
const req=(m,p,body)=>api(p,body===undefined?{method:m}:{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const post=(p,body)=>req('POST',p,body);
function fmtBytes(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(1)+' KB':b+' B';}
function toHex(v){
  if(typeof v==='string')return v.startsWith('#')?v.toUpperCase():'#'+v.toUpperCase();
  return'#'+(Number(v)>>>0&0xFFFFFF).toString(16).padStart(6,'0').toUpperCase();
}
function inkOn(hex){
  const n=parseInt(hex.slice(1),16)||0;
  const lin=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  const L=0.2126*lin(n>>16&255)+0.7152*lin(n>>8&255)+0.0722*lin(n&255);
  return L>0.179?'#000':'#fff';
}
function colorPick(value,onInput,cls){
  const input=el('input',{type:'color',value:toHex(value)});
  const hex=el('span',{class:'chex'});
  const wrap=el('span',{class:'cpick'+(cls?' '+cls:'')},input,hex);
  const paint=()=>{
    const h=input.value.toUpperCase();
    hex.replaceChildren(h);
    hex.style.color=inkOn(h);
  };
  input.addEventListener('input',()=>{paint();onInput&&onInput();});
  paint();
  return{node:wrap,input,get:()=>input.value.toUpperCase(),
         set:v=>{input.value=toHex(v);paint();}};
}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s);
  const ta=el('textarea',{value:s});document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();
  return Promise.resolve();
}
function closeRowMenus(){
  document.querySelectorAll('.rowmenu .mlist').forEach(m=>{m.hidden=true;});
  document.querySelectorAll('.rowmenu .mbtn').forEach(b=>b.setAttribute('aria-expanded','false'));
}
document.addEventListener('click',closeRowMenus);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRowMenus();});

function rowMenu(items){
  const list=el('div',{class:'mlist',hidden:'hidden'});
  const btn=el('button',{class:'mbtn icon',title:t('more'),'aria-haspopup':'menu',
    'aria-expanded':'false'},'⋯');
  list.addEventListener('click',e=>e.stopPropagation());
  for(const it of items){
    if(!it)continue;
    const[label,fn,danger]=it;
    const b=el('button',danger?{class:'danger'}:null,label);
    if(danger)armable(b,()=>{closeRowMenus();fn();});
    else b.addEventListener('click',()=>{closeRowMenus();fn();});
    list.append(b);
  }
  if(!list.children.length)return null;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=list.hidden;
    closeRowMenus();
    if(open){list.hidden=false;btn.setAttribute('aria-expanded','true');}
  });
  return el('div',{class:'rowmenu'},btn,list);
}

function armable(btn,fn){
  let armed=null,saved=null;
  btn.addEventListener('click',()=>{
    if(armed){clearTimeout(armed);armed=null;btn.classList.remove('armed');btn.replaceChildren(...saved);fn();return;}
    saved=[...btn.childNodes];
    btn.classList.add('armed');btn.replaceChildren(t('sure'));
    armed=setTimeout(()=>{armed=null;btn.classList.remove('armed');btn.replaceChildren(...saved);},3000);
  });
  return btn;
}

const TZRULE=new Map(),TZFIRST=new Map();
TZ_TABLE.forEach(([rule,zones])=>{
  const list=zones.split(' ');
  TZFIRST.set(rule,list[0]);
  list.forEach(n=>TZRULE.set(n,rule));
});
const TZNAMES=[...TZRULE.keys()].sort();
const TZFMT=new Map();
function tzOffset(zone,at){
  let f=TZFMT.get(zone);
  if(!f)TZFMT.set(zone,f=new Intl.DateTimeFormat('en',{timeZone:zone,timeZoneName:'longOffset'}));
  const s=f.formatToParts(at).find(p=>p.type==='timeZoneName').value;
  const m=/GMT([+-])(\d+)(?::(\d+))?/.exec(s);
  return m?(m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3]||0)):0;
}
const tzOffsetStr=o=>'UTC'+(o<0?'-':'+')+Math.floor(Math.abs(o)/60)+(Math.abs(o)%60?':'+String(Math.abs(o)%60).padStart(2,'0'):'');
function tzState(zone){
  const now=new Date(),cur=tzOffset(zone,now);
  const DAY=864e5;
  let win=cur,sum=cur,next=null;
  for(let i=1;i<=366;i++){
    const o=tzOffset(zone,new Date(+now+i*DAY));
    win=Math.min(win,o);sum=Math.max(sum,o);
    if(next===null&&o!==cur)next=new Date(+now+i*DAY);
  }
  return{off:cur,dst:sum>win&&cur===sum,changes:sum>win,next};
}

function applyGpioCaps(c){
  const dflt=c.defaults||{};
  const gp=p=>'GPIO '+p;
  const inR=(rs,p)=>(rs||[]).some(r=>p>=r[0]&&p<=r[1]);
  const usable=[];
  for(let p=0;p<=c.max;p++)
    if(!inR(c.missing,p)&&!(c.reserved||[]).some(r=>p>=r.lo&&p<=r.hi))usable.push(p);
  const drive=usable.filter(p=>!inR(c.inputOnly,p));
  const adc=usable.filter(p=>inR(c.adc1,p));
  const opts=(k,pool,off)=>{
    const o=pool.map(p=>[p,p===dflt[k]?gp(p)+' (default)|'+gp(p)+' (Standard)':gp(p)]);
    SYSF[k].w='select';SYSF[k].fmt=gp;
    SYSF[k].opt=off?[[-1,'- not connected -|- nicht angeschlossen -']].concat(o):o;
  };
  opts('pinMatrix',c.matrix||[],false);
  ['pinBattery','pinLdr'].forEach(k=>opts(k,adc,true));
  ['pinBtnLeft','pinBtnSelect','pinBtnRight','pinBuzzer','pinI2cSda','pinI2cScl','pinDfTx',
   'pinI2sBclk','pinI2sLrclk','pinI2sDout'].forEach(k=>opts(k,drive,true));
  opts('pinDfRx',usable,true);
  const i2s=dflt.pinI2sBclk>=0?'gpio':'hidden';
  ['pinI2sBclk','pinI2sLrclk','pinI2sDout'].forEach(k=>{SYSF[k].g=i2s;});
}

function poller(fn,ms){
  const g=gen;let fails=0;
  (async function run(){
    if(g!==gen)return;
    const base=typeof ms==='function'?ms():ms;
    const t0=Date.now();
    let d=base;
    if(!document.hidden){
      try{await fn();fails=0;d=Math.max(0,base-(Date.now()-t0));}
      catch(e){fails++;d=Math.min(base*4*fails,10000);}
    }
    setTimeout(run,d);
  })();
}

function settingsPage(view,saveFn,afterSave){
  const subnav=el('div',{class:'subnav'});
  new ResizeObserver(()=>document.documentElement.style.setProperty('--subnav-h',subnav.offsetHeight+'px')).observe(subnav);
  const panel=el('div',{class:'panel'});
  const allFields=[];
  const onUpdate=[];
  const{bar,saveBtn,discBtn,show}=saveBar();
  function update(){
    show(allFields.filter(f=>f.dirty()).length);
    allFields.forEach(f=>{
      if(!f.def.showIf)return;
      const [depKey,eq]=String(f.def.showIf).split('=');
      const dep=allFields.find(x=>x.key===depKey);
      f.row.style.display=dep&&(eq===undefined?dep.get():String(dep.get())===eq)?'':'none';
    });
    onUpdate.forEach(fn=>fn());
  }
  saveBtn.addEventListener('click',async()=>{
    const payload={};
    allFields.filter(f=>f.dirty()).forEach(f=>{
      payload[f.key]=f.get();
      if(f.def.derive)Object.assign(payload,f.def.derive(f.get()));
    });
    saveBtn.disabled=true;
    try{
      await saveFn(payload);
      allFields.forEach(f=>f.rebase());
      toast(t('saved'));
      await afterSave(payload);
    }catch(e){toast(e.message,false);}
    saveBtn.disabled=false;update();
  });
  discBtn.addEventListener('click',()=>{allFields.filter(f=>f.dirty()).forEach(f=>f.revert());update();});
  const spy=('IntersectionObserver'in window)?new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      subnav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.id));
    });
  },{rootMargin:'-15% 0px -70% 0px'}):null;
  function section(id,title,help,nodes){
    const sec=el('section',{class:'section',id:'sec-'+id},
      el('header',null,el('h2',null,title),help?el('div',{class:'ghelp'},help):null),
      el('div',{class:'rows'},nodes));
    panel.append(sec);
    const a=el('a',{'data-sec':'sec-'+id},title);
    a.addEventListener('click',()=>sec.scrollIntoView({behavior:'smooth',block:'start'}));
    subnav.append(a);
    if(spy)spy.observe(sec);
    return sec;
  }
  function addFields(fields){
    fields.forEach(f=>{
      allFields.push(f);
      f.row.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',update));
    });
    update();
  }
  view.append(el('div',{class:'settings'},subnav,panel),bar);
  return{section,addFields,panel,update,onUpdate};
}

  catch(e){
    box.replaceChildren(el('div',{class:'badge bad'},e.message));
    return false;
  }

  const fields=(d&&Array.isArray(d.fields))?d.fields:[];
  const warnings=(d&&Array.isArray(d.warnings))?d.warnings:[];
  if(!fields.length){
    box.replaceChildren(...warnings.map(warnBadge),el('div',{class:'mono'},t('cfgNone')));
    return true;
  }
  const rows=fields.map(f=>mkField(f.key,cfgDef(f),f.value,paint));

  const disc=el('button',null,t('discard'));

    try{
      const{data}=await req('PATCH','/api/v1/apps/'+encodeURIComponent(name)+'/config',body);
      if(!(data&&data.error))toast(t('cfgSaved'));

  defs.addEventListener('click',()=>{
    rows.forEach(m=>{if(m.def.dflt!==undefined)m.fill(m.def.dflt);});

const BERRY_MODSET=new Set(BERRY_MODS);
const BERRY_CORESET=new Set(BERRY_CORE);

const BERRY_TOK=/(#-[\s\S]*?(?:-#|$))|(#[^\n]*)|('(?:\\.|[^'\\])*'?|"(?:\\.|[^"\\])*"?)|(0[xX][0-9a-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([A-Za-z_]\w*)|([(){}[\]])|([-+*/%<>=!&|^~?:.,;]+)/g;

function matchBracket(src,pos){
  const open='([{',close=')]}';
  for(const at of [pos,pos-1]){
    const ch=src[at];
    if(ch===undefined)continue;
    let dir=0,mate='';
    if(open.includes(ch)){dir=1;mate=close[open.indexOf(ch)];}
    else if(close.includes(ch)){dir=-1;mate=open[close.indexOf(ch)];}
    else continue;
    let depth=0;
    for(let i=at;i>=0&&i<src.length;i+=dir){
      if(src[i]===ch)depth++;
      else if(src[i]===mate&&!--depth)return dir>0?[at,i]:[i,at];
    }
  }
  return null;
}

function mkCodeEditor(){
  const gut=el('div',{class:'gut'});
  const hl=el('div',{class:'hl','aria-hidden':'true'});
  const ta=el('textarea',{class:'ta',spellcheck:'false',wrap:'off',autocapitalize:'off',
    autocomplete:'off',autocorrect:'off','aria-label':'Berry source'});
  const box=el('div',{class:'box'},hl,ta);
  const node=el('div',{class:'ed'},gut,box);
  const errStrip=el('i',{class:'err'}),curStrip=el('i',{class:'cur'});
  let errLine=0,lines=0,onEdit=null,onMove=null,frame=0;

  const cs=()=>getComputedStyle(ta);
  const metric=()=>({h:parseFloat(cs().lineHeight),top:parseFloat(cs().paddingTop),
    left:parseFloat(cs().paddingLeft)});
  let charW=0;
  function measure(){
    const s=cs();
    const probe=el('span',{style:'position:absolute;visibility:hidden;white-space:pre;'+
      'font-family:'+s.fontFamily+';font-size:'+s.fontSize},'0'.repeat(40));
    box.append(probe);
    charW=probe.getBoundingClientRect().width/40;probe.remove();
  }

  function paint(){
    frame=0;
    const src=ta.value,m=metric(),nodes=[errStrip,curStrip];
    const pair=document.activeElement===ta?matchBracket(src,ta.selectionStart):null;
    let last=0,prev='',prev2='';
    BERRY_TOK.lastIndex=0;
    for(let g;(g=BERRY_TOK.exec(src));){
      if(g.index>last)nodes.push(src.slice(last,g.index));
      last=BERRY_TOK.lastIndex;
      const txt=g[0];
      let cls='';
      if(g[1]||g[2])cls='c';
      else if(g[3])cls='s';
      else if(g[4])cls='n';
      else if(g[5]){
        if(BERRY_KW.has(txt))cls='k';
        else if(BERRY_MODSET.has(txt))cls='a';
        else if(prev==='.'&&BERRY_MODSET.has(prev2)&&BERRY_MEM.has(txt))cls='a';
        else if(BERRY_FN.has(txt))cls='a';
        else if(BERRY_CORESET.has(txt))cls='b';
      }else{
        cls=(pair&&(g.index===pair[0]||g.index===pair[1]))?'o m':'o';
      }
      nodes.push(cls?el('span',{class:cls},txt):txt);
      if(g[5]||g[6]||g[7]){prev2=prev;prev=txt;}
    }
    if(last<src.length)nodes.push(src.slice(last));
    nodes.push('\n');
    hl.replaceChildren(...nodes);

    const n=src.split('\n').length,cur=src.slice(0,ta.selectionStart).split('\n').length;
    if(n!==lines){
      lines=n;
      gut.replaceChildren(...Array.from({length:n},(_,i)=>el('b',null,String(i+1))));
    }
    for(let i=0;i<gut.children.length;i++){
      const b=gut.children[i];
      b.className=(i+1===errLine?'err':i+1===cur?'on':'');
    }
    errStrip.style.cssText=errLine&&errLine<=n
      ? 'top:'+(m.top+(errLine-1)*m.h)+'px;height:'+m.h+'px'
      : 'display:none';
    curStrip.style.cssText=cur===errLine?'display:none'
      :'top:'+(m.top+(cur-1)*m.h)+'px;height:'+m.h+'px';
    sync();
    if(onMove)onMove();
  }
  function schedule(){if(!frame)frame=requestAnimationFrame(paint);}
  function sync(){hl.scrollTop=gut.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;}

  function insert(text){
    if(!document.execCommand||!document.execCommand('insertText',false,text)){
      const s=ta.selectionStart,e=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
      ta.selectionStart=ta.selectionEnd=s+text.length;
    }
    changed();
  }
  function changed(){errLine=0;schedule();if(onEdit)onEdit();}

  ta.addEventListener('input',changed);
  ta.addEventListener('scroll',sync);
  ['click','keyup','select'].forEach(ev=>ta.addEventListener(ev,schedule));
  ta.addEventListener('blur',schedule);

  return {
    node,ta,box,
    get value(){return ta.value;},
    set value(v){ta.value=v;lines=0;errLine=0;schedule();},
    focus(){ta.focus();},
    onEdit(fn){onEdit=fn;},
    onMove(fn){onMove=fn;},
    markError(line){
      errLine=line||0;
      if(errLine){
        const m=metric();
        const y=m.top+(errLine-1)*m.h;
        if(y<ta.scrollTop||y>ta.scrollTop+ta.clientHeight-m.h)
          ta.scrollTop=Math.max(0,y-ta.clientHeight/2);
      }
      schedule();
    },
    caret(){
      const upto=ta.value.slice(0,ta.selectionStart),nl=upto.lastIndexOf('\n');
      return{line:upto.split('\n').length,col:upto.length-nl};
    },
    caretXY(){
      const m=metric(),c=this.caret();
      if(!charW)measure();
      return{x:m.left+(c.col-1)*charW-ta.scrollLeft,y:m.top+c.line*m.h-ta.scrollTop};
    },
    insert,
    repaint(){lines=0;schedule();},
  };
}
function viewScripts(view){
  const ed=mkCodeEditor();
  const nameIn=el('input',{type:'text',placeholder:t('name'),maxlength:'32',spellcheck:'false',
    pattern:'[A-Za-z0-9_-]{1,32}'});
  const fileIn=el('input',{type:'file',accept:'.ax'});
  const posOut=el('span'),byteOut=el('span'),stateOut=el('span',{class:'end'});
  const errBox=el('div',{class:'ederr',style:'display:none'});
  const dirtyDot=el('i',{class:'dirty'});
  const top=el('div',{class:'edtop'});
  const enc=new TextEncoder();
  let onDevice=null;

  function setStatus(err,name){
    ed.markError(err&&err.line?err.line:0);
    errBox.style.display=err?'':'none';
    stateOut.className='end';
    if(name===undefined){stateOut.replaceChildren();return;}
    if(!err){
      const off=S.scriptsOff===true;
      stateOut.replaceChildren(off?'○ '+t('scrsaved'):'✓ '+t('scrok'));
      stateOut.className=off?'end':'end good';
      return;
    }
    const where=[err.hook?t('scrinhook')+' '+err.hook+'()':null,
      err.line?t('scrline')+' '+err.line:null].filter(Boolean).join(' · ');
    stateOut.replaceChildren('⨯ '+(err.line?t('scrline')+' '+err.line:'ERR'));
    stateOut.className='end bad';
    errBox.replaceChildren(el('b',null,name),
      el('span',null,(where?where+' - ':'')+err.message));
  }
  function showPos(){
    const c=ed.caret();
    posOut.replaceChildren(t('scrline')+' '+c.line+':'+c.col);
  }
  function refresh(){
    const n=enc.encode(ed.value).length;
    showPos();
    byteOut.replaceChildren(n+' / '+S.scriptMax+' B');
    byteOut.className=n>S.scriptMax?'over':n>S.scriptMax*0.9?'warn':'';
    saveBtn.disabled=n>S.scriptMax;
    prevBtn.disabled=!onDevice||ed.value!==onDevice.src||!!onDevice.err;
    const dirty=!onDevice||ed.value!==onDevice.src||nameIn.value!==onDevice.name;
    top.classList.toggle('mod',dirty&&!!ed.value);
    empty.style.display=ed.value?'none':'';
    scrDraft={name:nameIn.value,src:ed.value,dirty,onDevice};
  }
  function load(name,src,err){
    nameIn.value=name;ed.value=src;
    onDevice=err===undefined?null:{name,src,err};
    setStatus(err||null,err===undefined?undefined:name);
    refresh();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function freshScriptName(base){
    const taken=new Set(allFiles().map(s=>s.name));
    if(!taken.has(base))return base;
    for(let i=2;;i++)if(!taken.has(base+i))return base+i;
  }
  function loadTemplate(mod){
    selName=null;
    const name=freshScriptName(mod?'NewModule':'NewApp');
    load(name,mod?MODULE_TEMPLATE(name):SCRIPT_TEMPLATE);
    paintTree();closeTree();ed.focus();
  }
  function startTemplate(mod){guardedSwitch(()=>loadTemplate(mod));}
  const empty=el('div',{class:'edempty'},
    el('button',{class:'pri',onclick:()=>startTemplate(false)},t('newscr')));
  const impBtn=el('button',{class:'ico',title:t('import'),'aria-label':t('import')},icon('import'));
  impBtn.addEventListener('click',()=>fileIn.click());
  fileIn.addEventListener('change',async()=>{
    const f=fileIn.files[0];fileIn.value='';
    if(!f)return;
    try{
      const src=await f.text();
      load(scriptName(scriptMeta(src,'name'))||scriptName(f.name.replace(/\.ax$/i,''))||'Imported',src);
      toast(f.name+' '+t('scrimported'));
    }catch(e){toast(e.message,false);}
  });
  const saveBtn=el('button',{class:'pri ico',title:t('save'),'aria-label':t('save')},icon('save'));
  async function save(){
    const name=nameIn.value.trim();
    if(!/^[A-Za-z0-9_-]{1,32}$/.test(name)){toast(t('scrbadname'),false);return false;}
    if(!ed.value.trim()){toast(t('scrempty'),false);return false;}
    if(enc.encode(ed.value).length>S.scriptMax){toast(t('scrtoobig'),false);return false;}
    const replacing=!!onDevice&&onDevice.name===name;
    const oldName=onDevice&&onDevice.name!==name?onDevice.name:null;
    saveBtn.disabled=true;
    try{
      let data;
      for(let attempt=0;;attempt++){
        try{
          ({data}=await api('/api/v1/apps/script/'+encodeURIComponent(name),
            {method:'PUT',headers:{'Content-Type':'text/plain'},body:ed.value}));
          break;
        }catch(e){
          if(e.code!=='serviceBusy'||attempt>=3)throw e;
          await new Promise(res=>setTimeout(res,900));
        }
      }
      const err=(data&&data.error)||null;
      if(oldName){
        try{await req('DELETE','/api/v1/apps/'+encodeURIComponent(oldName));}
        catch(e){toast(e.message,false);}
      }
      onDevice={name,src:ed.value,err};
      setStatus(err,name);
      selName=name;refreshTree();
      toast(err?t('scrbroken'):oldName?t('renamed'):t('saved'),!err);
      if(replacing&&!err)stateOut.replaceChildren('● '+t('scrreload'));
      refresh();
      return true;
    }catch(e){toast(e.message,false);}
    refresh();
    return false;
  }
  saveBtn.addEventListener('click',save);
  const prevBtn=el('button',{class:'ico',title:t('scrpreview'),'aria-label':t('scrpreview')},icon('eye'));
  prevBtn.addEventListener('click',async()=>{
    try{
      await req('PUT','/api/v1/apps/active',{name:onDevice.name});
      toast(t('scrpreviewed'));
    }catch(e){toast(e.message,false);}
  });
  const expBtn=el('button',{class:'ico',title:t('export'),'aria-label':t('export')},icon('export'));
  expBtn.addEventListener('click',()=>{
    if(!ed.value.trim()){toast(t('scrempty'),false);return;}
    download((nameIn.value.trim()||'script')+'.ax',ed.value);
  });

  const pop=el('div',{class:'ac',style:'display:none'});
  let acItems=[],acSel=0;
  const acClose=()=>{pop.style.display='none';acItems=[];};
  function acWord(){
    const m=/[A-Za-z_][\w.]*$/.exec(ed.ta.value.slice(0,ed.ta.selectionStart));
    return m?{text:m[0],at:m.index}:null;
  }
  function acPaint(){
    pop.replaceChildren(...acItems.map((s,i)=>{
      const p=s.indexOf('(');
      return el('div',{class:i===acSel?'on':'',onmousedown:e=>{e.preventDefault();acSel=i;acAccept();}},
        p<0?s:s.slice(0,p),p<0?null:el('span',{class:'g'},s.slice(p)));
    }));
  }
  function acShow(force){
    const w=acWord();
    if(!w&&!force)return acClose();
    if(w&&!force&&w.text.length<2)return acClose();
    const q=w?w.text.toLowerCase():'';
    acItems=BERRY_API.concat(BERRY_MODS,BERRY_CORE).filter(s=>s.toLowerCase().startsWith(q)).slice(0,40);
    if(!acItems.length||(w&&acItems.length===1&&acItems[0].split('(')[0]===w.text))return acClose();
    acSel=0;acPaint();
    const xy=ed.caretXY();
    pop.style.cssText='left:'+Math.max(0,xy.x-6)+'px;top:'+(xy.y+4)+'px';
  }
  function acAccept(){
    const s=acItems[acSel];
    if(!s)return acClose();
    const w=acWord();
    if(w){ed.ta.selectionStart=w.at;ed.ta.selectionEnd=w.at+w.text.length;}
    const callable=s.includes('('),empty=s.endsWith('()');
    ed.insert(s.split('(')[0]+(callable?'()':''));
    if(callable&&!empty)ed.ta.selectionStart=ed.ta.selectionEnd=ed.ta.selectionEnd-1;
    acClose();
  }

  const INDENT='  ';
  const OPENS=/^\s*(def|if|elif|else|while|for|do|class|try|except)\b(?!.*\bend\b)/;
  function lineSpan(){
    const v=ed.ta.value;
    const a=v.lastIndexOf('\n',ed.ta.selectionStart-1)+1;
    let b=v.indexOf('\n',ed.ta.selectionEnd);
    return[a,b<0?v.length:b];
  }
  function mapLines(fn){
    const[a,b]=lineSpan(),v=ed.ta.value;
    const out=v.slice(a,b).split('\n').map(fn).join('\n');
    ed.ta.selectionStart=a;ed.ta.selectionEnd=b;
    ed.insert(out);
    ed.ta.selectionStart=a;ed.ta.selectionEnd=a+out.length;
  }
  ed.ta.addEventListener('keydown',e=>{
    if(acItems.length){
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!e.shiftKey){
        e.preventDefault();
        acSel=(acSel+(e.key==='ArrowDown'?1:acItems.length-1))%acItems.length;
        acPaint();
        const on=pop.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
        return;
      }
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acAccept();return;}
      if(e.key==='Escape'){e.preventDefault();acClose();return;}
    }
    const mod=(e.ctrlKey||e.metaKey)&&!e.altKey;
    if(mod&&(e.key==='.'||e.code==='Period')){e.preventDefault();acShow(true);return;}
    if(mod&&(e.key==='/'||e.key==='#'||e.code==='Backslash'||(e.code==='Slash'&&e.key!=='-'))){
      e.preventDefault();
      const[a,b]=lineSpan(),rows=ed.ta.value.slice(a,b).split('\n');
      const all=rows.filter(r=>r.trim()).every(r=>/^\s*#/.test(r));
      mapLines(r=>all?r.replace(/^(\s*)#\s?/,'$1'):r.trim()?r.replace(/^(\s*)/,'$1# '):r);
      return;
    }
    if(e.key==='Tab'){
      e.preventDefault();
      if(ed.ta.selectionStart===ed.ta.selectionEnd&&!e.shiftKey)return ed.insert(INDENT);
      mapLines(r=>e.shiftKey?r.replace(/^ {1,2}/,''):r.trim()?INDENT+r:r);
      return;
    }
    if(e.key==='Enter'){
      const v=ed.ta.value,a=v.lastIndexOf('\n',ed.ta.selectionStart-1)+1;
      const cur=v.slice(a,ed.ta.selectionStart);
      const pad=(/^\s*/.exec(cur)||[''])[0];
      e.preventDefault();
      ed.insert('\n'+pad+(OPENS.test(cur)?INDENT:''));
      return;
    }
  });
  function saveKey(e){
    if(!document.body.contains(ed.ta)){document.removeEventListener('keydown',saveKey);return;}
    if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.code==='KeyS'||e.key.toLowerCase()==='s')){
      e.preventDefault();save();
    }
  }
  document.addEventListener('keydown',saveKey);
  let dedenting=false;
  ed.onEdit(()=>{
    const v=ed.ta.value,c=ed.ta.selectionStart;
    const a=v.lastIndexOf('\n',c-1)+1;
    if(!dedenting&&/^ +end$/.test(v.slice(a,c))&&(c===v.length||v[c]==='\n')){
      dedenting=true;
      ed.ta.selectionStart=a;ed.ta.selectionEnd=c;
      ed.insert(v.slice(a,c).replace(/^ {1,2}/,''));
      dedenting=false;
      return;
    }
    setStatus(undefined,undefined);
    refresh();acShow(false);
  });
  ed.onMove(showPos);
  ed.ta.addEventListener('blur',()=>setTimeout(acClose,120));
  nameIn.addEventListener('input',refresh);
  ed.box.append(empty,pop);

  const ftlist=el('div',{class:'ftlist'});
  const modlist=el('div',{class:'ftlist'});
  const treeCount=el('span',{class:'ftcount'});
  const scrCount=el('span',{class:'ftcount'});
  const modCount=el('span',{class:'ftcount'});
  const newFileBtn=el('button',{class:'pri',title:t('newscr'),'aria-label':t('newscr')},'+');
  const newModBtn=el('button',{class:'pri',title:t('newmod'),'aria-label':t('newmod')},'+');
  let scripts=[],modules=[],selName=null,renaming=false;
  const allFiles=()=>scripts.concat(modules);
  const isDirty=()=>top.classList.contains('mod');
  async function refreshTree(){
    try{
      const{data}=await api('/api/v1/apps');
      const byName=(a,b)=>a.name.localeCompare(b.name);
      const rows=(Array.isArray(data)?data:[])
        .filter(a=>a.origin==='script'||a.origin==='module')
        .map(a=>({name:a.name,error:a.error||null,module:a.origin==='module'}));
      scripts=rows.filter(a=>!a.module).sort(byName);
      modules=rows.filter(a=>a.module).sort(byName);
    }catch(e){scripts=[];modules=[];}
    paintTree();
  }
  function paintTree(){
    renaming=false;
    const total=scripts.length+modules.length;
    treeCount.textContent=total?String(total):'';
    scrCount.textContent=scripts.length?String(scripts.length):'';
    modCount.textContent=modules.length?String(modules.length):'';
    const hadFocus=filetree.contains(document.activeElement);
    ftlist.replaceChildren(...(scripts.length?scripts.map(treeItem)
      :[el('div',{class:'empty'},t('scrnolist'))]));
    modlist.replaceChildren(...(modules.length?modules.map(treeItem)
      :[el('div',{class:'empty'},t('modnone'))]));
    if(hadFocus){
      const row=filetree.querySelector('.ftitem.on')||filetree.querySelector('.ftitem');
      if(row)row.focus();
    }
  }
  let pendingConfirm=null;
  function guardedSwitch(run){
    if(!isDirty())return run();
    if(pendingConfirm)pendingConfirm.remove();
    const from=nameIn.value.trim()||t('scrnone');
    pendingConfirm=toast(from+': '+t('scrunsaved'),false,[
      {label:t('save'),pri:true,fn:async()=>{if(await save())run();}},
      {label:t('discard'),fn:run},
      {label:t('cancel'),fn:()=>{}},
    ]);
  }
  async function reallyOpen(name){
    try{
      const{text}=await api('/api/v1/apps/script/'+encodeURIComponent(name));
      const s=allFiles().find(x=>x.name===name);
      load(name,text,(s&&s.error)||null);
      selName=name;paintTree();closeTree();
    }catch(e){toast(e.message,false);}
  }
  function openScript(name){
    if(name===selName||renaming)return;
    guardedSwitch(()=>reallyOpen(name));
  }
  function moveRow(item,d){
    const rows=[...filetree.querySelectorAll('.ftitem')];
    const at=rows.indexOf(item);
    if(at<0)return;
    rows[(at+d+rows.length)%rows.length].focus();
  }
  function treeItem(s){
    const on=s.name===selName;
    const item=el('div',{class:'ftitem'+(on?' on':'')+(s.error?' err':''),
      role:'button',tabindex:'0','aria-current':on?'true':null,
      title:s.error?'ERR: '+(s.error.message||''):s.name},
      icon('file'),el('span',{class:'nm'},s.name));
    item.addEventListener('click',()=>openScript(s.name));
    item.addEventListener('keydown',e=>{
      if(renaming||e.target!==item)return;
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openScript(s.name);}
      else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();moveRow(item,e.key==='ArrowDown'?1:-1);}
    });
    const ren=el('button',{title:t('rename'),'aria-label':t('rename')},icon('pen'));
    ren.addEventListener('click',()=>beginRename(s,item));
    const del=armable(el('button',{class:'danger',title:t('del'),'aria-label':t('del')},icon('trash')),async()=>{
      try{
        await req('DELETE','/api/v1/apps/'+encodeURIComponent(s.name));
        toast(t('deleted'));
        if(selName===s.name){selName=null;load('','');}
        await refreshTree();
      }catch(e){toast(e.message,false);}
    });
    const fx=el('span',{class:'fx'},ren,del);
    fx.addEventListener('click',e=>e.stopPropagation());
    item.append(fx);
    return item;
  }
  function beginRename(s,item){
    if(renaming)return; renaming=true;
    let done=false;
    const inp=el('input',{class:'ftren',type:'text',value:s.name,maxlength:'32',spellcheck:'false'});
    item.replaceChildren(icon('file'),inp);
    inp.focus();inp.select();
    inp.addEventListener('click',e=>e.stopPropagation());
    const cancel=()=>{if(done)return;done=true;paintTree();};
    async function commit(){
      if(done)return;
      const nn=inp.value.trim();
      if(!nn||nn===s.name)return cancel();
      done=true;
      if(!/^[A-Za-z0-9_-]{1,32}$/.test(nn)){toast(t('scrbadname'),false);return paintTree();}
      if(allFiles().some(x=>x.name===nn)){toast(t('scrclash'),false);return paintTree();}
      try{
        const{text}=await api('/api/v1/apps/script/'+encodeURIComponent(s.name));
        await api('/api/v1/apps/script/'+encodeURIComponent(nn),
          {method:'PUT',headers:{'Content-Type':'text/plain'},body:text});
        await req('DELETE','/api/v1/apps/'+encodeURIComponent(s.name));
        if(selName===s.name){selName=nn;nameIn.value=nn;if(onDevice)onDevice.name=nn;refresh();}
        toast(t('renamed'));await refreshTree();
      }catch(e){toast(e.message,false);paintTree();}
    }

const NESTED=['scroll','weekdayBar'];
function mergeDisplayData(settings,display){
  const data={...settings,power:!!display.power,overlay:display.overlay||'',
    overlaySpeed:Math.round(((display.overlaySettings||{}).speed??1)*100)};
  for(const n of NESTED){
    for(const[k,v]of Object.entries(data[n]||{}))data[n+'.'+k]=v;
    delete data[n];
  }
  for(const k in NULLABLE)if(k in data&&data[k]==null)data[k]=NULLABLE[k];
  return data;
}

  badCredentials:'mqeAuth',rejected:'mqeRejected',timeout:'mqeTimeout',lost:'mqeLost'};
const MQSTATE={disabled:'mqoff',offline:'mqdown',connecting:'mqbusy',connected:'mqup'};
function paintMqtt(node,m){
  if(!m){node.replaceChildren();node.className='badge';return;}
  const parts=[t(MQSTATE[m.state]||'mqdown')];
  if(m.state==='connected'&&m.endpoint)parts.push(m.endpoint);
  if(m.error)parts.push(MQERR[m.error]?t(MQERR[m.error]):m.error);
  if(m.retryInMs>0)parts.push(t('mqRetry')+' '+Math.ceil(m.retryInMs/1000)+' s');
  node.className='badge'+(m.state==='connected'?' good':m.state==='offline'?' bad':'');
  node.replaceChildren(parts.join(' · '));
}

function uploadZone(dir,accept,hint,onDone,asGif){
  const fileIn=el('input',{type:'file',accept,multiple:''});
  const list=el('div',{class:'uplist'});
  const zone=el('div',{class:'drop'},hint,list);
  zone.addEventListener('click',()=>fileIn.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');handle(e.dataTransfer.files);});
  fileIn.addEventListener('change',()=>{handle(fileIn.files);fileIn.value='';});
  async function handle(files){
    for(const f of files){
      const row=el('div',null,f.name+' - 0%');
      list.append(row);
      try{
        const conv=asGif?await iconAsGif(f,f.name):null;
        const nm=conv?conv.name:f.name;
        await uploadFile(conv?conv.blob:f,dir,nm,p=>row.replaceChildren(nm+' - '+(p*100).toFixed(0)+'%'));
        if(conv)await dropStale(dir,f.name,nm);
        row.replaceChildren(nm+' ✓ '+t('uploaded'));
      }catch(e){row.replaceChildren(f.name+' ✗ '+e.message);toast(f.name+': '+e.message,false);}
    }
    setTimeout(()=>list.replaceChildren(),4000);
    onDone();
  }
  return el('div',null,zone,fileIn);
}

const RTTTL_FREQ=[0,
  262,277,294,311,330,349,370,392,415,440,466,494,
  523,554,587,622,659,698,740,784,831,880,932,988,
  1047,1109,1175,1245,1319,1397,1480,1568,1661,1760,1865,1976,
  2093,2217,2349,2489,2637,2794,2960,3136,3322,3520,3729,3951];
const RTTTL_SEMI={c:1,d:3,e:5,f:6,g:8,a:10,b:12};
const RTTTL_MAX=512;
const RTTTL_GAP=0.006;
const noteMs=(d,timeUnit)=>Math.floor(d*timeUnit/2);
function rtttlParse(s){
  const bad=(error,index)=>({ok:false,error,index});
  if(s.length>RTTTL_MAX)return bad('melody is longer than '+RTTTL_MAX+' characters',RTTTL_MAX);
  const c1=s.indexOf(':');if(c1<0)return bad("missing ':' after the melody name",s.length);
  const c2=s.indexOf(':',c1+1);if(c2<0)return bad("missing ':' before the notes",s.length);
  const title=s.slice(0,c1).trim();
  if(!title)return bad('the melody name is empty',0);
  if(title.length>24)return bad('the melody name is longer than 24 characters',24);
  const def={d:4,o:6,b:63},seen={};
  const dtxt=s.slice(c1+1,c2);
  for(const part of dtxt.split(',')){
    const at=c1+1+dtxt.indexOf(part);
    if(!part.trim())continue;
    const m=/^\s*([dobDOB])\s*=\s*(\d+)\s*$/.exec(part);
    if(!m)return bad("expected 'd=', 'o=' or 'b=' here",at);
    const k=m[1].toLowerCase(),v=+m[2];
    if(seen[k])return bad("'"+k+"' is set twice",at);
    seen[k]=1;
    if(k==='d'&&![1,2,4,8,16,32].includes(v))return bad("'d' must be 1, 2, 4, 8, 16 or 32",at);
    if(k==='o'&&(v<4||v>7))return bad("'o' must be 4, 5, 6 or 7",at);
    if(k==='b'&&(v<10||v>300))return bad("'b' must be between 10 and 300",at);
    def[k]=v;
  }
  const timeUnit=Math.floor(Math.floor(60*1000*4/def.b)/32);
  const notes=[];
  let i=c2+1;
  const rest=s.slice(c2+1);
  const parts=rest.split(',');
  for(const part of parts){
    const at=i;i+=part.length+1;
    const m=/^\s*(\d+)?([a-gpA-GP])(#)?(\.)?(\d)?(\.)?\s*$/.exec(part);
    if(!m)return bad(part.trim()?"'"+part.trim()+"' is not a note":'empty note',at);
    const dur=m[1]===undefined?def.d:+m[1];
    if(![1,2,4,8,16,32].includes(dur))return bad('note length must be 1, 2, 4, 8, 16 or 32',at);
    const letter=m[2].toLowerCase(),isRest=letter==='p';
    if(m[3]&&isRest)return bad('a rest cannot be sharp',at);
    if(m[3]&&(letter==='b'||letter==='e'))return bad("'"+letter+"#' is not a note; use the next letter",at);
    if(m[4]&&m[6])return bad('note is dotted twice',at);
    const oct=m[5]===undefined?def.o:+m[5];
    if(oct<4||oct>7)return bad('octave must be 4, 5, 6 or 7',at);
    let units=64/dur;
    if(m[4]||m[6])units+=units/2;
    notes.push({f:isRest?0:RTTTL_FREQ[(oct-4)*12+RTTTL_SEMI[letter]+(m[3]?1:0)],d:units});
  }
  if(!notes.length)return bad('the melody has no notes',c2+1);
  const ms=notes.reduce((a,n)=>a+noteMs(n.d,timeUnit),0);
  return{ok:true,title,timeUnit,notes,durationMs:ms};
}
let audioCtx=null,audioStop=null;
function previewStop(){if(audioStop){audioStop();audioStop=null;}}
function previewPlay(p){
  previewStop();
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  }catch(e){toast(t('neterr'),false);return;}
  if(audioCtx.state==='suspended')audioCtx.resume();
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='square';
  const t0=audioCtx.currentTime+0.02;
  let at=t0;
  gain.gain.setValueAtTime(0,t0);
  for(const n of p.notes){
    const dur=noteMs(n.d,p.timeUnit)/1000;
    if(n.f){
      osc.frequency.setValueAtTime(n.f,at);
      const gap=dur>2*RTTTL_GAP?RTTTL_GAP:0;
      gain.gain.setValueAtTime(0.13,at);
      gain.gain.setValueAtTime(0,at+dur-gap);
    }else gain.gain.setValueAtTime(0,at);
    at+=dur;
  }
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(t0);osc.stop(at+0.05);
  audioStop=()=>{try{gain.gain.cancelScheduledValues(audioCtx.currentTime);
    gain.gain.setValueAtTime(0,audioCtx.currentTime);osc.stop();}catch(e){}};
  osc.onended=()=>{audioStop=null;};
}

};
const palIsBuiltin=name=>{const hit=palFind(name);return hit?hit[0]:'';};
const palNew=()=>({stops:[{c:'#FF0000',p:0},{c:'#0000FF',p:100}],placed:false});
function palLerp(a,b,f){
  const mix=sh=>{const va=a>>sh&255,v=va+(((b>>sh&255)-va)*f|0);return v<0?0:v>255?255:v;};
  return mix(16)<<16|mix(8)<<8|mix(0);
}
function palExpand(stops){
  const n=Math.min(stops.length,PAL_MAX),out=new Array(16);
  if(!n)return out.fill(0);
  const src=stops.slice(0,n).map(h=>parseInt(h.slice(1),16));
  if(n===1)return out.fill(src[0]);
  for(let i=0;i<16;i++){
    const pos=i*(n-1)/15,lo=Math.floor(pos);
    out[i]=palLerp(src[lo],src[Math.min(lo+1,n-1)],pos-lo);
  }
  return out;
}
function palExpandPlaced(stops){
  const n=Math.min(stops.length,PAL_MAX),out=new Array(16);
  if(!n)return out.fill(0);
  const src=stops.slice(0,n).map(s=>({v:parseInt(s.c.slice(1),16),p:s.p}))
                            .sort((a,b)=>a.p-b.p);
  if(n===1)return out.fill(src[0].v);
  for(let i=0;i<16;i++){
    const at=i*100;
    if(at<=src[0].p*15){out[i]=src[0].v;continue;}
    let lo=0;
    while(lo+1<n&&src[lo+1].p*15<=at)lo++;
    if(lo+1>=n){out[i]=src[n-1].v;continue;}
    const a=src[lo].p*15,b=src[lo+1].p*15;
    out[i]=palLerp(src[lo].v,src[lo+1].v,b>a?(at-a)/(b-a):0);
  }
  return out;
}
const palTable=v=>v.placed?palExpandPlaced(v.stops):palExpand(v.stops.map(s=>s.c));
const palEven=(i,n)=>n>1?i*100/(n-1):0;
const palPosOf=(v,i)=>v.placed?v.stops[i].p:palEven(i,v.stops.length);
const palFileText=v=>
  v.stops.map(s=>s.c.slice(1).toUpperCase()+(v.placed?'@'+s.p:'')).join('\n')+'\n';
function palParseFile(text){
  const out=[];
  let placed=0;
  for(const raw of text.split(/\r?\n/)){
    if(out.length>=PAL_MAX)break;
    let s=raw.trim();
    if(s.startsWith('#'))s=s.slice(1);
    if(!s)continue;
    const at=s.indexOf('@'),hex=at<0?s:s.slice(0,at);
    if(!/^[0-9A-Fa-f]{6}$/.test(hex))return null;
    let p=0;
    if(at>=0){
      const tail=s.slice(at+1);
      if(!/^\d{1,3}$/.test(tail))return null;
      p=parseInt(tail,10);
      if(p>100)return null;
      placed++;
    }
    out.push({c:'#'+hex.toUpperCase(),p});
  }
  if(!out.length||(placed&&placed!==out.length))return null;
  if(placed)out.sort((a,b)=>a.p-b.p);
  return{stops:out,placed:!!placed};
}
const palScale8=(v,s)=>(v*(s+1))>>8;
function palSample(ent,index,blend){
  const hi=index>>4,lo=index&15,e=ent[hi];
  let r=e>>16&255,g=e>>8&255,b=e&255;
  if(lo&&blend){
    const nx=ent[hi===15?0:hi+1],f2=lo<<4,f1=255-f2;
    r=palScale8(r,f1)+palScale8(nx>>16&255,f2);
    g=palScale8(g,f1)+palScale8(nx>>8&255,f2);
    b=palScale8(b,f1)+palScale8(nx&255,f2);
  }
  return'#'+((r<<16|g<<8|b)>>>0).toString(16).padStart(6,'0');
}
const palObs=new ResizeObserver(es=>es.forEach(e=>palPaint(e.target)));
function palRamp(cls){
  const cv=el('canvas',{class:'ramp'+(cls?' '+cls:'')});
  palObs.observe(cv);
  return cv;
}
function palSet(cv,v,blend){
  cv._v={stops:v.stops.map(s=>({c:s.c,p:s.p})),placed:v.placed};
  cv._bl=blend;
  palPaint(cv);
}
function palPaint(cv){
  const w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h||!cv._v)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(w*dpr));
  cv.height=Math.max(1,Math.round(h*dpr));
  const ent=palTable(cv._v),g=cv.getContext('2d'),n=cv.width;
  for(let x=0;x<n;x++){
    g.fillStyle=palSample(ent,Math.round((n>1?x/(n-1):0)*240),cv._bl);
    g.fillRect(x,0,1,cv.height);
  }
}
function viewPalettes(view){
  let files={};
  let sel=null;
  let pend='';
  let pal=palNew();
  let selRef=null;
  let blend=true,mark='',dragging=false;
  const palKey=v=>(v.placed?'p:':'e:')+v.stops.map(s=>s.c+'@'+s.p).join(',');
  const dirty=()=>palKey(pal)!==mark;

  const list=el('div',{class:'pallist'});
  const listCount=el('span',{class:'ftcount'});
  const listHd=el('div',{class:'palhd',role:'button',tabindex:'0','aria-expanded':'false'},
                   el('h2',null,t('palettes')),listCount,
                   el('span',{class:'chev'},icon('chev')));
  const fold=open=>{
    listHd.parentNode.classList.toggle('open',open);
    listHd.setAttribute('aria-expanded',open?'true':'false');
  };
  listHd.addEventListener('click',()=>fold(!listHd.parentNode.classList.contains('open')));
  listHd.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();fold(!listHd.parentNode.classList.contains('open'));
    }
  });
  const nameIn=el('input',{type:'text',maxlength:'24',placeholder:t('name')});
  const count=el('span',{class:'palcount'});
  const prev=palRamp('big');
  const track=el('div',{class:'palhandles'});
  const bar=el('div',{class:'palbar'},prev,track);
  const note=el('div',{class:'palnote'});
  const colPick=colorPick('#FF0000',()=>setColor(colPick.get()));
  const colIn=colPick.input;
  colIn.setAttribute('aria-label',t('palstopcol'));
  const posIn=el('input',{type:'number',min:'0',max:'100',step:'1','aria-label':t('palstoppos')});
  const rmBtn=el('button',{class:'icon danger',title:t('palrmstop'),'aria-label':t('palrmstop')},'✕');
  const evenBtn=el('button',null,t('paleven'));
  const blendSw=mkSwitch(true,()=>{blend=blendSw.input.checked;paintPrev();});
  const newBtn=el('button',null,icon('plus'),' '+t('newpal'));
  const addBtn=el('button',null,icon('plus'),' '+t('paladd'));
  const tryBtn=el('button',null,t('tryit'));
  const saveBtn=el('button',{class:'pri'},t('save'));

  function load(kind,name,v,unsaved){
    sel=kind?{kind,name}:null;
    pend=kind?'':name;
    pal={stops:v.stops.map(s=>({c:s.c,p:s.p})),placed:v.placed};
    selRef=pal.stops[0];
    mark=unsaved?'':palKey(pal);
    paintEditor();
  }
  function guard(fn){
    if(!dirty()){fn();return;}
    toast(t('palunsaved'),false,[{label:t('discard'),fn},
                                 {label:t('save'),pri:true,fn:()=>save().then(ok=>{if(ok)fn();})}]);
  }
  function pick(kind,name){
    guard(()=>{
      const own=files[name.toLowerCase()];
      load(kind,name,kind==='builtin'&&(!own||own.bad)?palBuiltin(name):own.pal);
      paintList();fold(false);
    });
  }
  function dup(name,v){
    guard(()=>{
      let i=2,n=name+i;
      while(files[n.toLowerCase()]||palIsBuiltin(n))n=name+(++i);
      load(null,n,v,true);
      paintList();fold(false);
    });
  }

  function row(kind,name,v,over){
    const r=el('div',{class:'palrow'+(sel&&sel.kind===kind&&sel.name===name?' on':''),
                      role:'button',tabindex:'0'});
    const acts=el('div',{class:'acts'});
    if(v){
      const cp=el('button',{class:'icon',title:t('paldup'),'aria-label':t('paldup')},icon('copy'));
      cp.addEventListener('click',()=>dup(name,v));
      acts.append(cp);
    }
    if(kind==='user'||over){
      const lbl=over?t('palreset'):t('del');
      const rm=armable(el('button',{class:'icon danger',title:lbl,'aria-label':lbl},icon('trash')),
        async()=>{
          const f=files[name.toLowerCase()];
          try{
            await delFile('/PALETTES/'+f.file);
            toast(over?t('palrestored'):t('deleted'));
            await reload();
            if(sel&&sel.name===name){
              if(over)load('builtin',name,palBuiltin(name));
              else load(null,'',palNew());
            }
            paintList();
          }catch(e){toast(e.message,false);}
        });
      acts.append(rm);
    }
    const body=v?palRamp():el('div',{class:'palbad'},t('palbad'));
    if(v)palSet(body,v,true);
    r.replaceChildren(el('div',{class:'l1'},el('span',{class:'nm'},name),
                        over?el('span',{class:'tag'},t('paloverr')):null),
                      acts,body);
    if(v){
      const open=e=>{if(!e.target.closest('button'))pick(kind,name);};
      r.addEventListener('click',open);
      r.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e);}
      });
    }
    return r;
  }
  function paintList(){
    const kids=[el('div',{class:'grp'},t('palbuiltin'))];
    PAL_BUILTIN.forEach(([n])=>{
      const own=files[n.toLowerCase()];
      kids.push(row('builtin',n,own&&!own.bad?own.pal:palBuiltin(n),!!own));
    });
    const mine=Object.keys(files).filter(k=>!palIsBuiltin(k)).sort().map(k=>files[k]);
    kids.push(el('div',{class:'grp'},t('palyours'),
                el('span',{class:'mono'},String(mine.length))));
    kids.push(...(mine.length?mine.map(f=>row('user',f.name,f.bad?null:f.pal,false))
                            :[el('div',{class:'empty'},t('palnone'))]));
    list.replaceChildren(...kids);
    listCount.replaceChildren(String(PAL_BUILTIN.length+mine.length));
  }

  function place(){
    if(pal.placed)return;
    const n=pal.stops.length;
    pal.stops.forEach((s,i)=>{s.p=Math.round(palEven(i,n));});
    pal.placed=true;
    evenBtn.disabled=false;
  }
  const posFromX=(clientX,rect)=>
    Math.max(0,Math.min(100,Math.round((clientX-rect.left)/Math.max(1,rect.width)*100)));

  function markSel(){
    const i=pal.stops.indexOf(selRef);
    [...track.children].forEach((h,j)=>h.classList.toggle('on',j===i));
  }

  function paintHandles(){
    const n=pal.stops.length;
    track.replaceChildren(...pal.stops.map((s,i)=>{
      const h=el('button',{type:'button',class:'palh'+(s===selRef?' on':''),
                           style:'left:'+palPosOf(pal,i)+'%',
                           title:t('palstop')+' '+(i+1),
                           'aria-label':t('palstop')+' '+(i+1)+', '+Math.round(palPosOf(pal,i))+'%'},
                 el('i',{style:'background:'+s.c}));
      h.addEventListener('pointerdown',e=>{
        if(e.button)return;
        e.preventDefault();
        selRef=s;markSel();paintStop();
        const rect=bar.getBoundingClientRect();
        const start=palPosOf(pal,pal.stops.indexOf(s));
        let moved=false;
        const onMove=ev=>{
          const p=posFromX(ev.clientX,rect);
          if(!moved&&p===start)return;
          moved=dragging=true;
          place();
          s.p=p;
          h.style.left=p+'%';
          h.classList.add('drag');
          posIn.value=String(p);
          paintPrev();
        };
        const onUp=()=>{
          window.removeEventListener('pointermove',onMove);
          window.removeEventListener('pointerup',onUp);
          window.removeEventListener('pointercancel',onUp);
          if(moved){pal.stops.sort((a,b)=>a.p-b.p);paintHandles();paintStop();}
          setTimeout(()=>{dragging=false;},0);
        };
        window.addEventListener('pointermove',onMove);
        window.addEventListener('pointerup',onUp);
        window.addEventListener('pointercancel',onUp);
      });
      h.addEventListener('click',e=>{
        e.stopPropagation();
        if(s===selRef)return;
        selRef=s;markSel();paintStop();
      });
      h.addEventListener('keydown',e=>{
        const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
        if(!d)return;
        e.preventDefault();
        place();
        s.p=Math.max(0,Math.min(100,s.p+d*(e.shiftKey?10:1)));
        pal.stops.sort((a,b)=>a.p-b.p);
        selRef=s;paintHandles();paintStop();paintPrev();
        const again=[...track.children][pal.stops.indexOf(s)];
        if(again)again.focus();
      });
      return h;
    }));
  }
  bar.addEventListener('click',e=>{
    if(dragging||e.target.closest('.palh'))return;
    if(pal.stops.length>=PAL_MAX){toast(t('palfull'),false);return;}
    const rect=bar.getBoundingClientRect();
    const p=posFromX(e.clientX,rect);
    const c=palSample(palTable(pal),Math.round(p/100*240),blend).toUpperCase();
    place();
    const st={c,p};
    pal.stops.push(st);
    pal.stops.sort((a,b)=>a.p-b.p);
    selRef=st;
    paintStops();
  });

  function paintStop(){
    const i=pal.stops.indexOf(selRef);
    if(i<0){selRef=pal.stops[0];return paintStop();}
    colPick.set(selRef.c);
    posIn.value=String(Math.round(palPosOf(pal,i)));
    rmBtn.disabled=pal.stops.length<2;
  }
  function setColor(hex){
    selRef.c=hex.toUpperCase();
    const i=pal.stops.indexOf(selRef);
    const h=[...track.children][i];
    if(h)h.firstChild.style.background=selRef.c;
    colPick.set(selRef.c);
    paintPrev();
  }
  posIn.addEventListener('input',()=>{
    const v=parseInt(posIn.value,10);
    if(!isFinite(v))return;
    place();
    selRef.p=Math.max(0,Math.min(100,v));
    pal.stops.sort((a,b)=>a.p-b.p);
    paintHandles();paintPrev();
  });
  rmBtn.addEventListener('click',()=>{
    if(pal.stops.length<2)return;
    const i=pal.stops.indexOf(selRef);
    pal.stops.splice(i,1);
    selRef=pal.stops[Math.min(i,pal.stops.length-1)];
    paintStops();
  });
  evenBtn.addEventListener('click',()=>{
    pal.placed=false;
    pal.stops.forEach(s=>{s.p=0;});
    paintStops();
  });
  addBtn.addEventListener('click',()=>{
    if(pal.stops.length>=PAL_MAX){toast(t('palfull'),false);return;}
    if(!pal.placed){
      pal.stops.push({c:pal.stops[pal.stops.length-1].c,p:0});
      selRef=pal.stops[pal.stops.length-1];
    }else{
      let at=0,gap=-1;
      for(let i=0;i+1<pal.stops.length;i++){
        const g=pal.stops[i+1].p-pal.stops[i].p;
        if(g>gap){gap=g;at=i;}
      }
      const p=gap>0?Math.round((pal.stops[at].p+pal.stops[at+1].p)/2)
                   :Math.min(100,pal.stops[pal.stops.length-1].p+1);
      const st={c:palSample(palTable(pal),Math.round(p/100*240),blend).toUpperCase(),p};
      pal.stops.push(st);
      pal.stops.sort((a,b)=>a.p-b.p);
      selRef=st;
    }
    paintStops();
  });

  function paintStops(){
    count.replaceChildren(pal.stops.length+'/'+PAL_MAX+' '+t('palstops'));
    count.classList.toggle('max',pal.stops.length>=PAL_MAX);
    evenBtn.disabled=!pal.placed;
    paintHandles();paintStop();paintPrev();
  }
  function paintPrev(){palSet(prev,pal,blend);}
  function paintSave(){
    const bi=sel&&sel.kind==='builtin';
    saveBtn.replaceChildren(bi?t('paloverride')
      :sel&&nameIn.value.trim()!==sel.name?t('palsaveas'):t('save'));
  }
  function paintEditor(){
    const bi=sel&&sel.kind==='builtin';
    nameIn.value=sel?sel.name:pend;
    nameIn.disabled=!!bi;
    note.replaceChildren(sel&&!bi?t('palownhelp'):'');
    paintSave();paintStops();
  }
  nameIn.addEventListener('input',paintSave);
  newBtn.addEventListener('click',()=>guard(()=>{
    load(null,'',palNew());
    paintList();fold(false);nameIn.focus();
  }));
  tryBtn.addEventListener('click',async()=>{
    const arr=pal.placed?pal.stops.map(s=>({color:s.c,pos:s.p})):pal.stops.map(s=>s.c);
    try{
      await post('/api/v1/notifications',
                 {text:'',durationMs:4000,effect:'Plasma',palette:arr,paletteBlend:blend});
      toast(t('shown'));
    }catch(e){toast(e.message,false);}
  });
  saveBtn.addEventListener('click',()=>save());

  async function save(){
    const name=nameIn.value.trim();
    if(!/^[A-Za-z0-9_-]{1,24}$/.test(name)){toast(t('palname'),false);return false;}
    const bi=palIsBuiltin(name);
    if(bi&&!(sel&&sel.kind==='builtin')){
      return new Promise(res=>{
        toast(bi+': '+t('palwillover'),false,
              [{label:t('cancel'),fn:()=>res(false)},
               {label:t('save'),pri:true,fn:()=>write(bi).then(res)}]);
      });
    }
    return write(bi||name);
  }
  async function write(name){
    saveBtn.disabled=true;
    try{
      await uploadFile(new Blob([palFileText(pal)],{type:'text/plain'}),'/PALETTES',name+'.txt',null);
      sel={kind:palIsBuiltin(name)?'builtin':'user',name};
      pend='';mark=palKey(pal);
      toast(t('palsaved'));
      await reload();
      paintEditor();
      return true;
    }catch(e){toast(e.message,false);return false;}
    finally{saveBtn.disabled=false;}
  }

  async function reload(){
    try{
      const{data}=await api('/api/v1/files?dir='+encodeURIComponent('/PALETTES'));
      const next={};
      await Promise.all((data.files||[]).filter(f=>/\.txt$/i.test(f.name)).map(async f=>{
        const base=f.name.replace(/\.txt$/i,'');
        try{
          const{text}=await api('/PALETTES/'+encodeURIComponent(f.name),{cache:'no-store'});
          const v=palParseFile(text);
          next[base.toLowerCase()]=v?{name:base,file:f.name,pal:v}
                                    :{name:base,file:f.name,bad:true};
        }catch(e){}
      }));
      files=next;
      paintList();
    }catch(e){toast(e.message,false);}
  }

  view.append(el('div',{class:'palwrap'},
    el('div',{class:'card palcard'},listHd,
      el('div',{class:'palbody'},
        el('div',{class:'ghelp'},t('palhelp')),
        list,
        el('div',{class:'row'},newBtn))),
    el('div',{class:'card'},
      el('h2',null,t('paledit')),
      el('div',{class:'palhead'},nameIn,count,
        el('span',{class:'palbl',title:t('palblendh')},
          el('span',{class:'mono'},t('palblend')),blendSw.node)),
      bar,
      el('div',{class:'palsel'},colPick.node,
        el('span',{class:'mono pl'},t('palstoppos')),posIn,
        el('span',{class:'grow'}),evenBtn,rmBtn),
      note,
      el('div',{class:'row palacts'},addBtn,el('span',{class:'grow'}),tryBtn,saveBtn))));
  load(null,'',palNew());
  reload();
}
function viewLog(view){
  const con=el('div',{class:'console'});
  let next=0,autoscroll=true,lines=[];
  con.addEventListener('scroll',()=>{
    autoscroll=con.scrollTop+con.clientHeight>=con.scrollHeight-8;
    asSw.input.checked=autoscroll;
  });
  const clearBtn=el('button',null,t('clear'));
  clearBtn.addEventListener('click',()=>{lines=[];con.replaceChildren();});
  const copyBtn=el('button',null,t('copy'));
  copyBtn.addEventListener('click',async()=>{await copyText(lines.join('\n'));toast(t('copied'));});
  const asSw=mkSwitch(true,()=>{autoscroll=asSw.input.checked;});
  view.append(el('div',{class:'card wide'},
    el('h2',null,t('log')),el('div',{class:'ghelp'},t('loghelp')),
    el('div',{class:'row'},clearBtn,copyBtn,el('span',{class:'grow'}),
      el('span',{class:'mono'},t('autoscroll')),asSw.node),
    con));
  poller(async()=>{
    const{data}=await api('/api/v1/logs?after='+next,{timeout:4000});
    if(!data||!Array.isArray(data.lines))return;
    next=data.next;
    if(data.lines.length){
      lines.push(...data.lines);
      if(lines.length>800){lines=lines.slice(-600);con.replaceChildren(lines.join('\n'));}
      else data.lines.forEach(l=>con.append(l+'\n'));
      if(autoscroll)con.scrollTop=con.scrollHeight;
    }
  },1000);
}
$('#langbtn').replaceChildren(LANG.toUpperCase());
paintTheme();
render();
const topbar=$('.topbar');
const setChromeH=()=>document.documentElement.style.setProperty('--chrome-h',topbar.offsetHeight+'px');
setChromeH();
new ResizeObserver(setChromeH).observe(topbar);
(async()=>{
  try{
    const{data}=await api('/api/v1/device',{timeout:5000});
    setStats(data);
    S.ap=!data.ipAddress||data.ipAddress==='0.0.0.0';
    if(S.ap)render();
  }catch(e){}
  try{
    const caps=(await api('/api/v1/capabilities')).data||{};
    if(!S.transitions.length)S.transitions=caps.transitions||[];
    S.radioCap=caps.radio===true;
    if(!S.radioCap)nav();
  }catch(e){}
  await loadSystemInfo();
})();
