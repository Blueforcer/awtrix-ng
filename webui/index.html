<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWTRIX NG</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 19 19'%3E%3Crect width='19' height='19' rx='4' fill='%23171717'/%3E%3Cpath fill='%23f5a568' opacity='.16' d='M2 2h3v3H2zM14 2h3v3h-3zM6 6h3v3H6zM10 6h3v3h-3zM6 14h3v3H6zM10 14h3v3h-3z'/%3E%3Cpath fill='%23f5a568' d='M6 2h3v3H6zM10 2h3v3h-3zM2 6h3v3H2zM14 6h3v3h-3zM2 10h3v3H2zM6 10h3v3H6zM10 10h3v3h-3zM14 10h3v3h-3zM2 14h3v3H2zM14 14h3v3h-3z'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#171717;--card:#222221;--card2:#292927;--border:#373632;--brd2:#302f2b;--fg:#f3f1ec;
  --dim:#a6a198;--acc:#f5a568;--pri:#f5a568;--onpri:#23170e;--ok:#8fbf72;--err:#ff9d90;--warn:#ffb65c;
  --errbrd:#74443d;--bnw:#3b2d20;--bna:#34261d;--badbg:#412421;--badfg:#ffd6d1;
  --con:#10100f;--confg:#f3f1ec;--sh:#0008;--trk:#514e47;
  --tkw:#ff7b72;--tapi:#ffa657;--tcore:#d2a8ff;--tstr:#a5d6ff;--tnum:#79c0ff;
  --tcom:#8b949e;--top:#b1bac4;--tsel:#2d4f76;--tselo:rgba(45,79,118,.45);--tcur:#1f242c;
  --r:12px;font-size:16px;
  --f1:11px;
  --f2:19px;
  --mono:"Cascadia Mono","IBM Plex Mono",ui-monospace,Consolas,monospace;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f5f4f1;--card:#fff;--card2:#f0eee9;--border:#e2dfd8;--brd2:#ebe8e2;--fg:#242321;
  --dim:#706c65;--acc:#ac470f;--pri:#ac470f;--onpri:#fff;--ok:#3d762e;--err:#b3261e;--warn:#945813;
  --errbrd:#e2afa8;--bnw:#fff0d8;--bna:#fbe9dc;--badbg:#fde9e5;--badfg:#751b15;
  --con:#181817;--confg:#f7f3ec;--sh:#342a201f;--trk:#c8c3b9;
  --tkw:#cf222e;--tapi:#953800;--tcore:#8250df;--tstr:#0a3069;--tnum:#0550ae;
  --tcom:#59636e;--top:#24292f;--tsel:#b6d9ff;--tselo:rgba(137,198,255,.4);--tcur:#f0f3f6;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-color:var(--trk) transparent;scrollbar-width:thin}
html{background:var(--bg);color:var(--fg)}
body{font:14px/1.5 "Segoe UI Variable","Aptos",system-ui,sans-serif;min-height:100vh;padding-bottom:70px;
  background-image:radial-gradient(circle,#f5a56812 1px,transparent 1.2px);background-size:16px 16px}
a{color:var(--acc);text-decoration:none}
h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin-bottom:2px}
button{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--border);
  border-radius:9px;padding:8px 14px;min-height:38px;cursor:pointer;white-space:nowrap;
  transition:border-color .14s,background .14s,transform .14s}
button:hover{border-color:var(--acc);background:var(--border)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;border-color:var(--border)}
button.pri,a.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri);font-weight:650}
a.pri{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border:1px solid var(--pri);border-radius:9px}
a.pri:hover{filter:brightness(1.06)}
button.danger{color:var(--err);border-color:var(--errbrd)}
button.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
button.icon{padding:7px 10px}
button.icon.kofi{background:#00b9fe;border-color:#00b9fe;height:36px;display:inline-flex;align-items:center;justify-content:center}
button.icon.kofi:hover{border-color:#00b9fe;filter:brightness(1.08)}
.kofilogo{width:18px;height:18px;flex:none}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);
  border-radius:9px;padding:8px 11px;min-height:40px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #f5a5681a}
:where(a,button,input,select,summary,textarea,[tabindex]):focus-visible,input[type=range]:focus-visible,.switch input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
input[type=checkbox]{width:auto}
input[type=color]{height:34px;flex:none;cursor:pointer}
.cpick{position:relative;display:inline-flex;flex:none}
.cpick input[type=color]{width:86px;padding:0;border:0;background:none;overflow:hidden}
.cpick input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cpick input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
.cpick input[type=color]::-moz-color-swatch{border:0;border-radius:7px}
.cpick .chex{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:11.5px/1 var(--mono);letter-spacing:.02em;pointer-events:none;border-radius:7px;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.42)}
.cpick:focus-within .chex{box-shadow:inset 0 0 0 2px var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc);border:none;background:none}
input[type=file]{display:none}
.topbar{position:sticky;top:0;z-index:20;background:#171717f2;backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);box-shadow:0 8px 30px #0003}
:root[data-theme=light] .topbar{background:#f5f4f1f2}
.topbar>header{display:flex;align-items:center;gap:11px;max-width:1180px;margin:auto;padding:12px 22px 9px}
.topbar>header .lg{width:24px;height:24px;flex:none;color:var(--acc);filter:drop-shadow(0 0 8px #f5a56845)}
.topbar>header h1{font-stretch:expanded;white-space:nowrap}
.topbar>header h1.off{color:var(--err)}
nav{display:flex;gap:6px;max-width:1180px;margin:auto;padding:0 18px 10px;overflow-x:auto}
nav a{position:relative;padding:8px 12px;border-radius:8px;color:var(--dim);font-size:13px;font-weight:550;white-space:nowrap}
nav a:hover{color:var(--fg);background:var(--card)}
nav a.on{color:var(--fg);background:var(--card);box-shadow:inset 0 0 0 1px var(--border)}
nav a.on::before{content:"";position:absolute;left:10px;right:10px;bottom:-3px;height:2px;background:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:24px 22px;display:grid;gap:18px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
main>.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px;
  box-shadow:0 10px 28px #00000016}
.card .ghelp{color:var(--dim);font-size:12.5px;margin-top:-6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.settings{grid-column:1/-1;display:grid;grid-template-columns:190px minmax(0,820px);gap:26px;justify-content:center}
.subnav{position:sticky;top:var(--chrome-h,104px);align-self:start;display:grid;gap:1px;padding-top:4px}
.subnav a{padding:9px 12px;border-radius:8px;color:var(--dim);font-size:13px;cursor:pointer;border-left:2px solid transparent}
.subnav a:hover{color:var(--fg);background:var(--card)}
.subnav a.on{color:var(--fg);background:var(--card);border-left-color:var(--acc);border-radius:0 8px 8px 0}
.panel{display:grid;gap:14px;min-width:0;padding-bottom:76px}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--r);scroll-margin-top:calc(var(--chrome-h,104px) + 6px);
  box-shadow:0 10px 28px #00000016;overflow:clip}
.section>header{padding:13px 18px 11px;border-bottom:1px solid var(--border);
  background:var(--card);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;box-shadow:inset 3px 0 0 var(--acc)}
.section>header .ghelp{color:var(--dim);font-size:12.5px;margin-top:2px}
.section .rows{padding:2px 18px}
.section .rows.pad{padding:12px 18px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--brd2)}
.frow:last-child{border-bottom:none}
.frow .lab{display:grid;gap:2px;min-width:0}
.frow .lab .l1{display:flex;align-items:baseline;gap:8px}
.frow .lab b{font-weight:500;font-size:13.5px}
.frow .key{display:none}
.frow .help{color:var(--dim);font-size:12px;max-width:52ch}
.frow .ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
#upd-notes .ic{width:22px;height:22px}
.unitwrap{position:relative;display:inline-flex;align-items:center}
.unitwrap .unit{position:absolute;right:9px;color:var(--dim);font-size:12px;pointer-events:none;
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unitwrap input[type=number]{padding-right:min(calc(var(--ul) + 16px),58px)}
.frow .ctl input[type=number]{-moz-appearance:textfield;width:110px}
.frow .ctl input[type=number]::-webkit-outer-spin-button,
.frow .ctl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.frow .ctl input[type=text],.frow .ctl input[type=password],.frow .ctl select{width:240px}
.frow .ctl input[type=range]{width:190px}
.frow.vol{padding:6px 0}
.frow.vol input[type=range]{min-height:0;height:24px}
.frow .val{color:var(--dim);font-size:12px;min-width:38px;text-align:right}
.frow.full{grid-template-columns:1fr}
.tzctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tzrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tzprev{color:var(--dim);font-size:12px;text-align:right}
.days{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.daybox{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid var(--trk);
  border-radius:6px;cursor:pointer;font-size:12px;user-select:none}
.daybox input{margin:0;cursor:pointer}
.daybox:has(input:checked){border-color:var(--acc);color:var(--acc)}
.daybox:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.wifiwrap{position:relative;width:240px}
.frow .ctl .wifiwrap input{width:100%;padding-right:28px}
.wificaret.on{color:var(--acc)}
.pwpair{display:flex;flex-direction:column;gap:6px;width:240px}
.frow .ctl .pwpair input{width:100%}
.frow .ctl input.pwbad{border-color:var(--err)}
.wificaret .ic{width:16px;height:16px}
.wificaret{position:absolute;top:0;right:0;height:100%;width:26px;display:flex;
  align-items:center;justify-content:center;border:none;background:transparent;
  color:var(--dim);font-size:11px;padding:0}
.wifimenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;padding:5px;
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  box-shadow:0 18px 48px var(--sh);max-height:210px;overflow-y:auto;overscroll-behavior:contain}
.wifiopt{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 11px;border-radius:7px;cursor:pointer;font-size:13px}
.wifiopt+.wifiopt{border-top:1px solid var(--border)}
.wifiopt:hover{background:var(--card2);color:var(--fg)}
.wifiopt .g{color:var(--dim);font-size:12px;white-space:nowrap}
.wifiopt:hover .g{color:#fff9}
#savebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;
  width:min(94vw,680px);padding:10px 12px 10px 16px;background:var(--card2);border:1px solid var(--border);border-left:3px solid var(--acc);
  border-radius:12px;box-shadow:0 16px 40px var(--sh)}
#savebar .n{color:var(--acc);font-weight:600}
.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;border-radius:11px;background:var(--trk);transition:background .15s,box-shadow .15s}
.switch i:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
.switch input:checked+i{background:var(--pri);box-shadow:0 0 0 3px #f5a56816}
.switch input:checked+i:before{left:21px}
.banner{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--bnw);border:1px solid var(--warn);
  border-radius:var(--r);padding:12px 15px;box-shadow:inset 3px 0 0 var(--warn)}
.banner.blue{background:var(--bna);border-color:var(--acc)}
.banner.rbstick{position:sticky;top:var(--chrome-h,104px);z-index:19;box-shadow:0 4px 14px var(--sh)}
.banner .bx{flex:none;background:none;border:none;color:var(--dim);font-size:15px;line-height:1;padding:3px 7px;border-radius:6px}
.banner .bx:hover{background:var(--card2);color:var(--fg)}
.captive-hint{display:none;gap:4px 8px;flex-wrap:wrap;font-size:12.5px}
.captive-hint a{font-weight:600;white-space:nowrap}
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:99;width:min(92vw,440px)}
.toast{padding:12px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--border);border-left:4px solid var(--ok);
  box-shadow:0 16px 44px var(--sh);font-size:13px;word-break:break-word;animation:tin .18s}
.toast.err{border-left-color:var(--err)}
.toast .tacts{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
.toast .tacts button{padding:5px 12px;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ic{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.hero{grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-bottom:5px solid #10100f;border-radius:16px;overflow:hidden;
  padding:12px 12px 0;box-shadow:0 18px 36px #0003}
canvas#screen{display:block;width:100%;aspect-ratio:4/1;image-rendering:pixelated;background:#050505;border:1px solid #000;border-radius:6px;
  box-shadow:inset 0 4px 18px #000,0 0 0 1px #ffffff0b}
.hctl{display:flex;align-items:center;gap:10px;padding:12px 2px;flex-wrap:wrap}
.hctl .lab{font-size:var(--f1);color:var(--dim)}
html.fs,html.fs body{margin:0;height:100%;background:#000;overflow:hidden}
html.fs body{display:flex;align-items:center;justify-content:center}
html.fs #screen{width:auto;height:auto;max-width:100vw;max-height:100vh;aspect-ratio:auto}
.hctl input[type=range]{flex:1;min-width:110px;width:auto}
.hctl .val{font:var(--f1)/1 var(--mono);color:var(--dim);min-width:26px;text-align:right}
.vitals{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.vit{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;
  display:grid;gap:6px;align-content:start;box-shadow:inset 0 2px 0 #f5a56824}
.vit .k{font-size:var(--f1);color:var(--dim);display:flex;align-items:center;gap:5px;min-width:0}
.vit .k span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vit .v{font:500 var(--f2)/1.1 var(--mono);display:flex;align-items:baseline;gap:2px}
.vit .v u{font-size:var(--f1);color:var(--dim);text-decoration:none}
.vit .b{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.vit .b i{display:block;height:100%;border-radius:2px}
.vit .s{font:var(--f1)/1.2 var(--mono);color:var(--dim)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;
  border:1px solid var(--border);border-radius:9px;background:var(--card);font:var(--f1)/1.4 var(--mono);color:var(--dim)}
.meta b{color:var(--fg);font-weight:400}
.grid-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;box-shadow:0 10px 24px #0002;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 16px 34px #0004}
.tile .pw{position:relative;flex:none;aspect-ratio:1;margin:8px 8px 0;border-radius:6px;
  background:#10100f radial-gradient(circle,#ffffff10 1px,transparent 1.2px);background-size:10px 10px}
.tile .pw img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;
  image-rendering:pixelated;display:block}
.tile .ft{display:flex;flex-wrap:wrap;align-items:start;gap:4px;padding:12px 12px 4px;min-width:0}
.tile .ft .nm{flex:1 1 100%;min-width:0;font-size:13px;line-height:1.45;overflow:hidden;
  text-overflow:ellipsis;overflow-wrap:anywhere}
.tile .ft .sz{flex:none;font:10px/1.5 var(--mono);color:var(--dim)}
.tile .acts{display:flex;justify-content:flex-end;gap:8px;flex:0 0 34px}
.tile .acts button{display:inline-flex;align-items:center;justify-content:center;min-width:28px;width:100%;
  padding:0;font-size:20px;line-height:1;background:var(--card2);border-color:var(--border);border-radius:7px}
.ihdr{display:flex;align-items:start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ihdr .st{flex:0 1 auto;min-width:140px;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;
  margin-top:8px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.ihdr .st .bar{flex:0 1 104px;height:6px}
.segbar{display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.segbar button{min-height:44px;padding:10px 13px;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--dim);font-size:13px;font-weight:600}
.segbar button:hover{color:var(--fg)}
.segbar button.on{color:var(--fg);border-bottom-color:var(--acc)}
.tmenu{position:absolute;inset:0 0 auto;z-index:2;display:flex;flex-direction:column;justify-content:start;gap:2px;
  min-height:100%;max-height:280px;padding:7px;background:var(--card);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 10px 28px var(--sh);overflow:auto}
.tile .ft input{flex:1;padding:2px 5px;font-size:11.5px}
.tile .ft button{flex:none;padding:2px 7px;font-size:11px}
.tile .ft.share input{flex:1 1 100%}
.tile .ft.share button.pri{flex:1}
.tile .ft.share .hint{flex:1 1 100%;font-size:10px;line-height:1.3;color:var(--dim)}
.tile .ft.share a.hint{text-decoration:underline}
.tile .ft.share a.hint:hover{color:var(--acc)}
.empty{position:relative;grid-column:1/-1;padding:32px 18px;text-align:center;color:var(--dim);font-size:13px;
  background:var(--card);border:1px dashed var(--border);border-radius:10px}
.empty::before{content:"";display:block;width:26px;height:10px;margin:0 auto 13px;
  background:linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 10px,var(--dim) 10px 16px,transparent 16px 20px,var(--border) 20px)}
.drop{border:2px dashed var(--border);border-radius:var(--r);padding:22px;text-align:center;color:var(--dim);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.drop:hover{border-color:var(--acc);color:var(--fg)}
.drop.over{border-color:var(--acc);color:var(--acc);background:#f5a56812}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;min-width:3px;background:var(--acc);border-radius:4px;transition:width .2s}
.bar>i.hot{background:var(--err)}
.console{background:var(--con);color:var(--confg);border:1px solid var(--border);border-radius:8px;padding:10px;height:60vh;overflow:auto;
  font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.mono{font:12px ui-monospace,Consolas,monospace;color:var(--dim)}
.palwrap{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,304px) minmax(0,1fr);
  gap:14px;align-items:start}
.palhd{display:flex;align-items:center;gap:8px}
.palhd h2{flex:0 1 auto}
.palhd .chev{display:none;color:var(--dim);flex:none;margin-left:auto}
.palhd .chev .ic{width:18px;height:18px}
.palbody{display:grid;gap:10px}
.ramp{display:block;width:100%;height:13px;border-radius:4px;border:1px solid var(--border)}
.pallist{display:grid;gap:3px}
.pallist .grp{display:flex;align-items:baseline;gap:7px;padding:13px 2px 5px;

(()=>{
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null)continue;
    if(k==='class')n.className=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='disabled'||k==='selected'){if(v)n[k]=true;}
    else if(k==='value')n.value=v;
    else n.setAttribute(k,v);
  }
  for(const k of kids.flat(9)){if(k==null)continue;n.append(k.nodeType?k:String(k));}
  return n;
}
function toast(msg,ok=true,actions){
  const d=el('div',{class:'toast'+(ok?'':' err'),role:ok?'status':'alert'},msg);
  if(actions&&actions.length){
    d.append(el('div',{class:'tacts'},...actions.map(a=>{
      const b=el('button',{class:a.pri?'pri':''},a.label);
      b.addEventListener('click',()=>{d.remove();a.fn();});
      return b;
    })));
  }else setTimeout(()=>d.remove(),ok?3000:6000);
  $('#toasts').append(d);
  return d;
}
const toastErr=e=>toast(e.message,false,e.code==='hubAuthentication'?[connectHubAction()]:undefined);
const setNet=ok=>$('#brand')?.classList.toggle('off',!ok);
async function api(path,opts={}){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),opts.timeout||12000);
  let r;
  try{r=await fetch(path,{signal:ctrl.signal,...opts});}
  catch(e){setNet(false);throw new Error(t('neterr'));}
  finally{clearTimeout(to);}
  setNet(true);
  const text=await r.text();
  let data=text;try{data=JSON.parse(text);}catch(e){}
  if(!r.ok&&r.status!==202){
    const err=data&&data.error;
    const e=new Error(err?(err.message||err.code)+(err.field?' ('+err.field+')':''):'HTTP '+r.status);
    e.status=r.status;e.code=err&&err.code;e.field=err&&err.field;
    throw e;
  }
  return{status:r.status,data,text};
}
const req=(m,p,body)=>api(p,body===undefined?{method:m}:{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const post=(p,body)=>req('POST',p,body);
function fmtBytes(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(1)+' KB':b+' B';}
function toHex(v){
  if(typeof v==='string')return v.startsWith('#')?v.toUpperCase():'#'+v.toUpperCase();
  return'#'+(Number(v)>>>0&0xFFFFFF).toString(16).padStart(6,'0').toUpperCase();
}
function inkOn(hex){
  const n=parseInt(hex.slice(1),16)||0;
  const lin=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  const L=0.2126*lin(n>>16&255)+0.7152*lin(n>>8&255)+0.0722*lin(n&255);
  return L>0.179?'#000':'#fff';
}
function colorPick(value,onInput,cls){
  const input=el('input',{type:'color',value:toHex(value)});
  const hex=el('span',{class:'chex'});
  const wrap=el('span',{class:'cpick'+(cls?' '+cls:'')},input,hex);
  const paint=()=>{
    const h=input.value.toUpperCase();
    hex.replaceChildren(h);
    hex.style.color=inkOn(h);
  };
  input.addEventListener('input',()=>{paint();onInput&&onInput();});
  paint();
  return{node:wrap,input,get:()=>input.value.toUpperCase(),
         set:v=>{input.value=toHex(v);paint();}};
}
function pressable(node,fn){
  node.addEventListener('click',fn);
  node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e);}});
}
function onDrag(move,end){
  const up=()=>{
    removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    end();
  };
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(s);
  const ta=el('textarea',{value:s});document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();
  return Promise.resolve();
}
function closeRowMenus(){
  document.querySelectorAll('.rowmenu .mlist').forEach(m=>{m.hidden=true;});
  document.querySelectorAll('.rowmenu .mbtn').forEach(b=>b.setAttribute('aria-expanded','false'));
}
document.addEventListener('click',closeRowMenus);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRowMenus();});

function rowMenu(items,buttonIcon){
  const list=el('div',{class:'mlist',hidden:'hidden'});
  const btn=el('button',{class:'mbtn icon',title:t('more'),'aria-label':t('more'),'aria-haspopup':'menu',
    'aria-expanded':'false'},buttonIcon?icon(buttonIcon):'⋯');
  list.addEventListener('click',e=>e.stopPropagation());
  for(const it of items)if(it)list.append(menuBtn(it[0],it[1],it[2],closeRowMenus));
  if(!list.children.length)return null;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=list.hidden;
    closeRowMenus();
    if(open){list.hidden=false;btn.setAttribute('aria-expanded','true');}
  });
  return el('div',{class:'rowmenu'},btn,list);
}
function menuBtn(label,fn,danger,close,attrs){
  const b=el('button',{class:danger?'danger':null,...attrs},label),go=()=>{close();fn();};
  if(danger)armable(b,go);else b.addEventListener('click',go);
  return b;
}

function armable(btn,fn,ready=()=>true,sure){
  let armed=null,saved=null,lbl;
  const say=v=>lbl&&btn.setAttribute('aria-label',v);
  const disarm=()=>{armed=null;btn.classList.remove('armed');btn.replaceChildren(...saved);say(lbl);};
  btn.addEventListener('click',()=>{
    if(!ready()){fn();return;}
    if(armed){clearTimeout(armed);disarm();fn();return;}
    saved=[...btn.childNodes];lbl=btn.getAttribute('aria-label');sure=sure||t('sure');
    btn.classList.add('armed');btn.replaceChildren(sure);say(sure);
    armed=setTimeout(disarm,3000);
  });
  return btn;
}

    if(g!==gen)return;

    const t0=Date.now();

      eager=false;
      try{await fn();fails=0;d=Math.max(0,base-(Date.now()-t0));}

async function fillConfigPanel(name,box,saveError,builtin){
  const groupOpen=new Map([...box.querySelectorAll('.cfgsection')].map(s=>[s.dataset.group,s.open]));
  box.replaceChildren(el('div',{class:'mono'},t('cfgLoading')));
  let d;
  try{({data:d}=await api(configUrl(name,builtin)));}
  catch(e){
    box.replaceChildren(el('div',{class:'badge bad'},e.message));
    return false;
  }

  const fields=(d&&Array.isArray(d.fields))?d.fields:[];
  const warnings=(d&&Array.isArray(d.warnings))?d.warnings:[];
  if(!fields.length){
    box.replaceChildren(...warnings.map(warnBadge),el('div',{class:'mono'},t('cfgNone')));
    return true;
  }
  const rows=fields.map(f=>mkField(f.key,cfgDef(f,builtin),f.value,paint));
  const save=el('button',{class:'pri'},t('save'));
  const disc=el('button',null,t('discard'));
  const defs=el('button',{class:'defaults',title:t('cfgDefaults')},t('cfgDefaults'));
  const err=el('div',{class:'badge bad'});
  err.hidden=!saveError;
  if(saveError)err.replaceChildren(errText(name,saveError));
  const bar=el('div',{class:'cfgbar'},defs,el('span',{class:'grow'}),disc,save);
  function paint(){
    const dirty=rows.some(m=>m.dirty());
    save.disabled=!dirty;disc.disabled=!dirty;
  }
  save.addEventListener('click',async()=>{
    const body={};
    rows.forEach((m,i)=>{
      if(!m.dirty())return;
      const path=Array.isArray(fields[i].path)&&fields[i].path.length?fields[i].path:[m.key];
      let target=body;
      path.slice(0,-1).forEach(k=>{target=target[k]||(target[k]={});});
      target[path.at(-1)]=m.get();
    });
    if(!Object.keys(body).length)return;
    save.disabled=true;
    try{
      const{data}=await req('PATCH',configUrl(name,builtin),body);
      if(!(data&&data.error))toast(t(builtin?'cfgSavedBuiltin':'cfgSaved'));
      await fillConfigPanel(name,box,data&&data.error,builtin);
      return;
    }catch(e){toastErr(e);}
    paint();
  });
  disc.addEventListener('click',()=>{rows.forEach(m=>m.revert());paint();});
  defs.addEventListener('click',()=>{
    rows.forEach(m=>{if(m.def.dflt!==undefined)m.fill(m.def.dflt);});
    paint();
  });

  const nodes=[],sections=new Map();
  rows.forEach((m,i)=>{
    const group=typeof fields[i].group==='string'?fields[i].group:'';
    if(group){
      let section=sections.get(group);
      if(!section){
        const label=builtin&&{time:'cfgGroupTime',date:'cfgGroupDate',calendar:'cfgGroupCalendar',weekday:'cfgGroupWeekday'}[group];
        const content=el('div',{class:'cfgrows'});
        section=el('details',{class:'cfgsection','data-group':group},
          el('summary',null,icon('chev'),el('h3',{class:'cfggrp'},label?t(label):group)),content);
        section.open=!!groupOpen.get(group);
        sections.set(group,section);nodes.push(section);
      }
      section.lastChild.append(m.row);
    }else{
      nodes.push(m.row);
    }
  });
  box.replaceChildren(...warnings.map(warnBadge),...nodes,err,bar);
  paint();
  return true;
}

function scriptMeta(src,key){

  return m?m[1].trim():'';
}
const ICONS_MAX=32;
function scriptIcons(src){
  const out=[];
  for(const raw of String(src||'').split(/\r?\n/)){
    const line=raw.trim();
    if(!line)continue;
    if(line[0]!=='#')break;
    const m=/^#[ \t]*@icons\b[ \t]*(.*)$/i.exec(line);
    if(!m)continue;
    for(const id of m[1].split('#')[0].split(/[,\s]+/)){
      if(!/^[A-Za-z0-9_-]{1,32}$/.test(id))continue;
      if(out.indexOf(id)<0&&out.length<ICONS_MAX)out.push(id);
    }
  }
  return out;
}
function scriptRequires(src){
  const out=[];
  for(const raw of String(src||'').split(/\r?\n/)){
    const line=raw.trim();
    if(!line)continue;
    if(line[0]!=='#')break;
    const m=/^#[ \t]*@requires(?:[ \t]+(.*))?$/i.exec(line);
    if(!m||out.length>=8)continue;
    const[name,hub]=(m[1]||'').split('#')[0].split(/[ \t]+/);
    if(!/^[A-Za-z0-9_-]{1,32}$/.test(name)||(hub&&!/^[A-Za-z0-9]{12}$/.test(hub))||out.some(r=>r.name===name))continue;
    out.push(hub?{name,hub}:{name});
  }
  return out;
}
const NEEDS_MAX=8;
function scriptNeeds(src){
  const out=[];
  for(const raw of String(src||'').split(/\r?\n/)){
    const line=raw.trim();
    if(!line)continue;
    if(line[0]!=='#')break;
    if(/^#[ \t]*@oauth[ \t]+\S/i.test(line)&&out.length<NEEDS_MAX&&!out.includes('oauth')){out.push('oauth');continue;}
    const m=/^#[ \t]*@needs(?:[ \t]+(.*))?$/i.exec(line);
    if(!m)continue;
    for(const word of (m[1]||'').split('#')[0].split(/[ \t,]+/)){
      const name=word.toLowerCase();
      if(out.length>=NEEDS_MAX||name.length>32||!/^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)*$/.test(name)||out.includes(name))continue;
      out.push(name);
    }
  }
  return out;
}
function scriptDisplay(src){
  let out=null;
  for(const raw of String(src||'').split(/\r?\n/)){
    const line=raw.trim();
    if(!line)continue;
    if(line[0]!=='#')break;
    const m=/^#[ \t]*@display[ \t]+(\d{1,3})[ \t]*x[ \t]*(\d{1,3})[ \t]*(#|$)/i.exec(line);
    if(m&&+m[1]>0&&+m[2]>0)out={width:+m[1],height:+m[2]};
  }
  return out;
}

const crc32=(()=>{const t=new Uint32Array(256);

function zipStore(entries){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=v=>[v&0xFF,(v>>8)&0xFF],u32=v=>[v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>>24)&0xFF];
  const now=new Date(),year=Math.max(1980,Math.min(2107,now.getFullYear()));
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((year-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const e of entries){
    const name=enc.encode(e.name);
    const data=e.data instanceof Uint8Array?e.data:enc.encode(String(e.data));
    const crc=crc32(data),sz=data.length;
    parts.push(new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),
      ...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0)]),name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),
      ...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]),name);
    off+=30+name.length+sz;
  }
  let cdSize=0;for(const c of central)cdSize+=c.length;
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),
    ...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,eocd],{type:'application/zip'});
}

async function collectBackup(cats){

  const text=async p=>(await fetch(p)).text();
  const list=async d=>((await api('/api/v1/files?dir='+encodeURIComponent(d))).data.files||[]);
  const grab=async dir=>{for(const f of await list(dir)){const b=baseName(f.name);
    entries.push({name:dir.slice(1)+'/'+b,data:await bytes(dir+'/'+encodeURIComponent(b))});}};
  let sys=null;
  if(cats.wifi||cats.settings)sys=(await api('/api/v1/system?secrets=1')).data;
  if(cats.wifi){entries.push({name:'config/wifi.json',
    data:JSON.stringify({wifiSsid:sys.wifiSsid||'',wifiPass:sys.wifiPass||''})});included.push('wifi');}
  if(cats.settings){

    entries.push({name:'config/settings.json',data:JSON.stringify((await api('/api/v1/settings')).data)});

      entries.push({name:'config/icon-origins.json',data:JSON.stringify(data)});}catch(e){if(e.status!==404)throw e;}
    included.push('icons');}
  if(cats.melodies){for(const m of((await api('/api/v1/audio/melodies')).data.melodies||[]))
    entries.push({name:'MELODIES/'+m.name+'.txt',data:m.rtttl});included.push('melodies');}
  if(cats.palettes){await grab('/PALETTES');included.push('palettes');}
  if(cats.mp3){await grab('/MP3');included.push('mp3');}
  if(cats.scripts){await grab('/SCRIPTS');
    for(const s of(await api('/api/v1/audio/mp3')).data.scripts||[])for(const f of s.files){const p='SCRIPTS/'+s.name+'/'+f.name;
      entries.push({name:p,data:await bytes('/'+p)});}

}

async function resolveScriptRequires(missing,have,taken,releases=new Map()){
  const seen=new Set(have),deps=[],left=[];

    for(const r of list){

      seen.add(r.name);
      if(!r.hub){left.push(r.name);continue;}
      try{
        if(taken.has(r.name))throw new Error(t('scrclash'));
        if(!releases.has(r.hub))releases.set(r.hub,hubScriptRelease(r.hub));
        const release=await releases.get(r.hub).catch(e=>{if(e.status===404)return null;throw e;});
        if(!release){left.push(r.name);continue;}
        const code=await hubScriptRelease(r.hub,'source');
        if(hubScriptHash(code)!==release.sha256)throw new Error(t('suIntegrity'));
        if(depth<4)await walk(scriptRequires(code),depth+1);
        deps.push({name:r.name,hub:r.hub,code,sounds:release.sounds});

    const files=allFiles().slice(),releases=new Map();
    if(!S.caps)try{readAudioCaps((await api('/api/v1/capabilities')).data||{});}catch(e){}
    async function worker(){
      while(files.length&&generation===checkGeneration&&view.isConnected){
        const file=files.shift(),url='/api/v1/apps/script/'+encodeURIComponent(file.name);
        try{
          const {text}=await api(url);
          const origin=hubScriptOrigin(text);
          if(!origin){hubUpdates.delete(file.name);continue;}
          if(!releases.has(origin.id))releases.set(origin.id,hubScriptRelease(origin.id));
          const release=await releases.get(origin.id);
          let ready=release.sha256!==origin.sha256;
          if(!ready&&(release.sounds?.length||sndCount.has(file.name))){
            const p=soundPlan(release,(await api(url+'/sounds')).data.files);
            ready=p.upload.length+p.remove.length>0;
          }
          if(generation!==checkGeneration)return;
          hubUpdates.set(file.name,{previous:text,release,modified:hubScriptHash(origin.code)!==origin.sha256,
            state:ready?'suReady':'suCurrent'});
        }catch(e){if(generation===checkGeneration)hubUpdates.set(file.name,{state:e.status===404?'suMissing':'suOffline'});}
      }
    }
    await Promise.all([worker(),worker()]);
    if(generation!==checkGeneration||!view.isConnected)return;
    checkHubBtn.disabled=false;checkHubBtn.textContent=t('suCheck');paintTree();paintHubUpdate();paintSounds();

function mergeDisplayData(settings,display){
  const data={...settings,power:!!display.power,overlay:display.overlay||'',
    overlaySpeed:Math.round(((display.overlaySettings||{}).speed??1)*100)};
  for(const n of NESTED){
    for(const[k,v]of Object.entries(data[n]||{}))data[n+'.'+k]=v;
    delete data[n];
  }
  for(const k in NULLABLE)if(k in data&&data[k]==null)data[k]=NULLABLE[k];
  return data;
}

    let state=t('mi'+m.state);
    if(m.state==='sizeMismatch'&&m.sourceWidth)state+=' ('+m.sourceWidth+' × '+m.sourceHeight+')';

  node.className='badge'+(bad?' bad':m.state==='showing'||m.sharing?' good':'');

  if(!m){node.replaceChildren();node.className='badge';return;}
  const parts=[t(MQSTATE[m.state]||'mqdown')];
  if(m.state==='connected'&&m.endpoint)parts.push(m.endpoint);
  if(m.error)parts.push(MQERR[m.error]?t(MQERR[m.error]):m.error);
  if(m.retryInMs>0)parts.push(t('mqRetry')+' '+Math.ceil(m.retryInMs/1000)+' s');

  node.replaceChildren(parts.join(' · '));
}

const RELEASES_API='https://api.github.com/repos/Blueforcer/awtrix-ng/releases/latest';
const OTA_BASE='https://blueforcer.github.io/awtrix-ng/firmware/ota/';
let firmwareBusy=false;
const UPD_KEY='awtrixUpdate';
const UPD_TTL_MS=6*3600*1000;
const verParts=v=>String(v||'').replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0);
function verNewer(a,b){
  const x=verParts(a),y=verParts(b);
  for(let i=0;i<3;i++)if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0);
  return false;
}
function updCached(){
  try{const c=JSON.parse(localStorage.getItem(UPD_KEY)||'null');if(c&&Date.now()-c.at<UPD_TTL_MS)return c;}catch(e){}
  return null;
}
async function updCheck(){
  if(navigator.onLine===false)throw new Error(t('updfail'));
  const r=await fetch(RELEASES_API,{headers:{Accept:'application/vnd.github+json'},cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(!r.ok)throw new Error(t((r.status===403&&r.headers?.get('x-ratelimit-remaining')==='0')||r.status===429?'updrate':'updfail'));
  const j=await r.json();
  const assets={};
  for(const a of j.assets||[])if(a&&a.name)assets[a.name]=a.browser_download_url;
  const c={at:Date.now(),version:String(j.tag_name||'').replace(/^v/,''),usable:!j.draft&&!j.prerelease,
    published:String(j.published_at||'').slice(0,10),notes:j.html_url||'',assets};
  try{localStorage.setItem(UPD_KEY,JSON.stringify(c));}catch(e){}
  return c;
}
function updAvailable(c){
  const run=S.stats&&S.stats.version;
  return c&&c.usable&&run&&verNewer(c.version,run)?c:null;
}
async function downloadFirmware(release,onProgress){
  const image=S.stats&&S.stats.updateImage;
  const awup=image==='awtrix-ng-tc002.awup';
  if(!awup&&!['firmware-awtrix-ng.bin','firmware-awtrix-ng-s3-octal.bin','firmware-awtrix-ng-s3-quad.bin'].includes(image))throw new Error(t('updnotready'));
  const options={credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(120000)};
  const response=await fetch(OTA_BASE+'index.json',options);
  if(!response.ok)throw new Error(t('updnotready'));
  const manifest=await response.json();
  const asset=manifest.assets&&manifest.assets[image];
  if(manifest.version!=='v'+release.version||!/^v\d+\.\d+\.\d+$/.test(manifest.version)||!asset)throw new Error(t('updnotready'));
  if(!Number.isSafeInteger(asset.size)||asset.size<256||asset.size>(awup?8:16)*1024*1024||!/^[a-f0-9]{64}$/.test(asset.sha256))throw new Error(t('updbadfile'));
  const r=await fetch(OTA_BASE+manifest.version+'/'+image,options);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const reader=r.body.getReader(),bytes=new Uint8Array(asset.size);
  let offset=0;
  try{
    for(;;){
      const {done,value}=await reader.read();
      if(done)break;
      if(offset+value.length>bytes.length)throw new Error(t('updbadfile'));
      bytes.set(value,offset);offset+=value.length;onProgress(offset/bytes.length);
    }
  }finally{await reader.cancel();}
  if(offset!==asset.size||(awup?String.fromCharCode(...bytes.subarray(0,8))!=='AWUPD003':bytes[0]!==0xe9)||iconSha256(bytes)!==asset.sha256)throw new Error(t('updbadfile'));
  return new File([bytes],image,{type:'application/octet-stream'});
}

  const status=el('div',{id:'upd-status',class:'help'},'');
  notes.hidden=true;
  async function show(force){
    if(firmwareBusy)return;

function uploadZone(dir,accept,hint,onDone,asGif){
  const fileIn=el('input',{type:'file',accept,multiple:''});
  const list=el('div',{class:'uplist'});
  const zone=el('div',{class:'drop',role:'button',tabindex:'0'},hint,list);
  let queue=Promise.resolve();
  const handle=files=>{files=[...files];queue=queue.then(()=>run(files));};
  pressable(zone,()=>fileIn.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');handle(e.dataTransfer.files);});
  fileIn.addEventListener('change',()=>{handle(fileIn.files);fileIn.value='';});
  async function run(files){
    for(const f of files){
      const row=el('div',null,f.name+' - 0%');
      list.append(row);
      try{
        const conv=asGif?await iconAsGif(f,f.name):null;
        const nm=conv?conv.name:f.name;
        await uploadFile(conv?conv.blob:f,dir,nm,p=>row.replaceChildren(nm+' - '+(p*100).toFixed(0)+'%'));
        if(conv)await dropStale(dir,f.name,nm);
        row.replaceChildren(nm+' ✓ '+t('uploaded'));
      }catch(e){row.replaceChildren(f.name+' ✗ '+e.message);toast(f.name+': '+e.message,false);}
    }
    setTimeout(()=>list.replaceChildren(),4000);
    onDone();
  }
  return el('div',null,zone,fileIn);
}

    [a,b,c,d,e,f,g,j].forEach((n,i)=>h[i]=(h[i]+n)>>>0);

const RTTTL_SEMI={c:-9,d:-7,e:-5,f:-4,g:-2,a:0,b:2};
const RTTTL_MAX=512;

const noteMs=(d,timeUnit)=>Math.floor(d*timeUnit/2);
function rtttlParse(s){
  const bad=(error,index)=>({ok:false,error,index});
  if(s.length>RTTTL_MAX)return bad('melody is longer than '+RTTTL_MAX+' characters',RTTTL_MAX);
  const c1=s.indexOf(':');if(c1<0)return bad("missing ':' after the melody name",s.length);
  const c2=s.indexOf(':',c1+1);if(c2<0)return bad("missing ':' before the notes",s.length);
  const title=s.slice(0,c1).trim();
  if(!title)return bad('the melody name is empty',0);
  if(title.length>24)return bad('the melody name is longer than 24 characters',24);
  const def={d:4,o:6,b:63},seen={};
  const dtxt=s.slice(c1+1,c2);
  for(const part of dtxt.split(',')){
    const at=c1+1+dtxt.indexOf(part);
    if(!part.trim())continue;
    const m=/^\s*([dobDOB])\s*=\s*(\d+)\s*$/.exec(part);
    if(!m)return bad("expected 'd=', 'o=' or 'b=' here",at);
    const k=m[1].toLowerCase(),v=+m[2];
    if(seen[k])return bad("'"+k+"' is set twice",at);
    seen[k]=1;
    if(k==='d'&&![1,2,4,8,16,32].includes(v))return bad("'d' must be 1, 2, 4, 8, 16 or 32",at);
    if(k==='o'&&(v<4||v>7))return bad("'o' must be 4, 5, 6 or 7",at);
    if(k==='b'&&(v<10||v>300))return bad("'b' must be between 10 and 300",at);
    def[k]=v;
  }
  const timeUnit=Math.floor(Math.floor(60*1000*4/def.b)/32);
  const notes=[];
  let i=c2+1;
  const rest=s.slice(c2+1);
  const parts=rest.split(',');
  for(const part of parts){
    const at=i;i+=part.length+1;
    const m=/^\s*(\d+)?([a-gpA-GP])(#)?(\.)?(\d)?(\.)?\s*$/.exec(part);
    if(!m)return bad(part.trim()?"'"+part.trim()+"' is not a note":'empty note',at);
    const dur=m[1]===undefined?def.d:+m[1];
    if(![1,2,4,8,16,32].includes(dur))return bad('note length must be 1, 2, 4, 8, 16 or 32',at);
    const letter=m[2].toLowerCase(),isRest=letter==='p';
    if(m[3]&&isRest)return bad('a rest cannot be sharp',at);
    if(m[3]&&(letter==='b'||letter==='e'))return bad("'"+letter+"#' is not a note; use the next letter",at);
    if(m[4]&&m[6])return bad('note is dotted twice',at);
    const oct=m[5]===undefined?def.o:+m[5];
    if(oct<4||oct>7)return bad('octave must be 4, 5, 6 or 7',at);
    let units=64/dur;
    if(m[4]||m[6])units+=units/2;
    notes.push({f:isRest?0:Math.round(440*2**(((oct-4)*12+RTTTL_SEMI[letter]+(m[3]?1:0))/12)),d:units});
  }
  if(!notes.length)return bad('the melody has no notes',c2+1);
  const ms=notes.reduce((a,n)=>a+noteMs(n.d,timeUnit),0);
  return{ok:true,title,timeUnit,notes,durationMs:ms};

function playState(btn,on,local=false){
  const lbl=t(on?(local?'meloprestop':'melostop'):(local?'melopre':'meloplay'));
  const name=btn._audioName&&btn._audioName();
  btn.classList.toggle('playing',on);btn.replaceChildren(on?'■':local?'🎧':'▶');
  btn.title=lbl;btn.setAttribute('aria-label',lbl+(name?': '+name:''));
  btn.setAttribute('aria-pressed',on?'true':'false');
}
function audioPlayButton(name,local=false){
  const b=el('button',{class:'icon '+(local?'preview-play':'device-play')});b._audioName=typeof name==='function'?name:()=>name;
  playState(b,false,local);return b;
}
function previewStop(){
  if(audioStop){audioStop();audioStop=null;}
  if(audioPreviewBtn){playState(audioPreviewBtn,false,true);audioPreviewBtn=null;}
}
function previewPlay(p,btn){
  previewStop();
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  }catch(e){toast(t('neterr'),false);return;}
  if(audioCtx.state==='suspended')audioCtx.resume();
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='square';
  const t0=audioCtx.currentTime+0.02;
  let at=t0;
  gain.gain.setValueAtTime(0,t0);
  for(const n of p.notes){
    const dur=noteMs(n.d,p.timeUnit)/1000;
    if(n.f){
      osc.frequency.setValueAtTime(n.f,at);
      const gap=dur>2*RTTTL_GAP?RTTTL_GAP:0;
      gain.gain.setValueAtTime(0.13,at);
      gain.gain.setValueAtTime(0,at+dur-gap);
    }else gain.gain.setValueAtTime(0,at);
    at+=dur;
  }
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(t0);osc.stop(at+0.05);
  audioStop=()=>{try{gain.gain.cancelScheduledValues(audioCtx.currentTime);
    gain.gain.setValueAtTime(0,audioCtx.currentTime);osc.stop();}catch(e){}};
  audioPreviewBtn=btn;playState(btn,true,true);
  osc.onended=()=>{audioStop=null;if(audioPreviewBtn===btn){playState(btn,false,true);audioPreviewBtn=null;}};
}
async function devicePlayToggle(btn,body,durationMs=0){
  const stop=devicePlayBtn===btn;
  try{
    await post(stop?'/api/v1/audio/stop':'/api/v1/audio/play',stop?{group:'station' in body?'radio':'alert'}:body);
    if(devicePlayBtn)playState(devicePlayBtn,false);
    clearTimeout(devicePlayTimer);devicePlayTimer=null;devicePlayBtn=stop?null:btn;
    if(!stop){
      playState(btn,true);toast(t('playing'));
      if(durationMs)devicePlayTimer=setTimeout(()=>{
        if(devicePlayBtn===btn){playState(btn,false);devicePlayBtn=null;}
      },durationMs+250);
    }
    setTimeout(()=>audioTick(),300);
  }catch(e){toastErr(e);}
}
function markRows(list,name,busy){

  list.querySelectorAll('.arow').forEach(r=>{
    const on=name!==''&&r.dataset.name===name;
    r.classList.toggle('on',on);
    if(on)active=r.querySelector('.device-play');
  });
  if(active&&devicePlayBtn!==active){
    if(devicePlayBtn)playState(devicePlayBtn,false);
    devicePlayBtn=active;playState(active,true);
  }else if(!active&&!busy&&devicePlayBtn&&list.contains(devicePlayBtn)){
    playState(devicePlayBtn,false);devicePlayBtn=null;clearTimeout(devicePlayTimer);devicePlayTimer=null;

function editForm(list,anchor,inputs,msg,extra,save){

async function viewAudio(view){

    catch(e){view.append(el('div',{class:'card wide'},t('neterr')));return;}
    if(g!==gen)return;
  }
  if(!anyAudioCap()){view.append(el('div',{class:'card wide'},t('audnone')));return;}
  const{section,panel}=sectionShell(view);
  const vols=[];
  const slider=key=>{
    let timer=null,held=false,edits=0;
    const f=mkField(key,Object.assign({},SYSF[key],{h:''}),0,()=>{
      edits++;clearTimeout(timer);
      const id=timer=setTimeout(()=>req('PATCH','/api/v1/settings',{[key]:f.get()}).catch(toastErr)
        .finally(()=>{if(timer===id)timer=null;}),300);
    });
    const up=()=>{held=false;removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};
    f.row.querySelector('input[type=range]').addEventListener('pointerdown',()=>{

  section('mixer',t('mixer'),'',mixKeys.map(slider),1);
  poller(async()=>{
    const before=vols.map(v=>v.mark());
    const{data}=await api('/api/v1/settings');
    vols.forEach((v,i)=>{if(v.key in data&&before[i]>=0&&v.mark()===before[i])v.f.set(data[v.key]);});
  },2000,true);
  if(hasSink('mp3')){
    const mp3s=mp3Section(location.hash.split('/')[2]);

  }
  if(hasSink('rtttl'))
    section('melodies',t('melodies'),t('melodieshelp'),melodiesSection(),1);
  if(np){
    audioTick=async()=>{
      if(g!==gen)return;
      try{const{data}=await api('/api/v1/audio');np.show(data);marks.forEach(m=>m(data));}catch(e){}
    };
    audioTick();

  }

const palFind=name=>PAL_BUILTIN.find(p=>p[0].toLowerCase()===name.toLowerCase());
const palBuiltin=name=>{
  const hit=palFind(name);
  return{stops:(hit?hit[1].split(' '):[]).map(h=>({c:'#'+h,p:0})),placed:false};
};
const palIsBuiltin=name=>{const hit=palFind(name);return hit?hit[0]:'';};
const palNew=()=>({stops:[{c:'#FF0000',p:0},{c:'#0000FF',p:100}],placed:false});
function palLerp(a,b,f){
  const mix=sh=>{const va=a>>sh&255,v=va+(((b>>sh&255)-va)*f|0);return v<0?0:v>255?255:v;};
  return mix(16)<<16|mix(8)<<8|mix(0);
}
function palExpand(stops){
  const n=Math.min(stops.length,PAL_MAX),out=new Array(16);
  if(!n)return out.fill(0);
  const src=stops.slice(0,n).map(h=>parseInt(h.slice(1),16));
  if(n===1)return out.fill(src[0]);
  for(let i=0;i<16;i++){
    const pos=i*(n-1)/15,lo=Math.floor(pos);
    out[i]=palLerp(src[lo],src[Math.min(lo+1,n-1)],pos-lo);
  }
  return out;
}
function palExpandPlaced(stops){
  const n=Math.min(stops.length,PAL_MAX),out=new Array(16);
  if(!n)return out.fill(0);
  const src=stops.slice(0,n).map(s=>({v:parseInt(s.c.slice(1),16),p:s.p}))
                            .sort((a,b)=>a.p-b.p);
  if(n===1)return out.fill(src[0].v);
  for(let i=0;i<16;i++){
    const at=i*100;
    if(at<=src[0].p*15){out[i]=src[0].v;continue;}
    let lo=0;
    while(lo+1<n&&src[lo+1].p*15<=at)lo++;
    if(lo+1>=n){out[i]=src[n-1].v;continue;}
    const a=src[lo].p*15,b=src[lo+1].p*15;
    out[i]=palLerp(src[lo].v,src[lo+1].v,b>a?(at-a)/(b-a):0);
  }
  return out;
}
const palTable=v=>v.placed?palExpandPlaced(v.stops):palExpand(v.stops.map(s=>s.c));
const palEven=(i,n)=>n>1?i*100/(n-1):0;
const palPosOf=(v,i)=>v.placed?v.stops[i].p:palEven(i,v.stops.length);
const palFileText=v=>
  v.stops.map(s=>s.c.slice(1).toUpperCase()+(v.placed?'@'+s.p:'')).join('\n')+'\n';
function palParseFile(text){
  const out=[];
  let placed=0;
  for(const raw of text.split(/\r?\n/)){
    if(out.length>=PAL_MAX)break;
    let s=raw.trim();
    if(s.startsWith('#'))s=s.slice(1);
    if(!s)continue;
    const at=s.indexOf('@'),hex=at<0?s:s.slice(0,at);
    if(!/^[0-9A-Fa-f]{6}$/.test(hex))return null;
    let p=0;
    if(at>=0){
      const tail=s.slice(at+1);
      if(!/^\d{1,3}$/.test(tail))return null;
      p=parseInt(tail,10);
      if(p>100)return null;
      placed++;
    }
    out.push({c:'#'+hex.toUpperCase(),p});
  }
  if(!out.length||(placed&&placed!==out.length))return null;
  if(placed)out.sort((a,b)=>a.p-b.p);
  return{stops:out,placed:!!placed};
}
const palScale8=(v,s)=>(v*(s+1))>>8;
function palSample(ent,index,blend){
  const hi=index>>4,lo=index&15,e=ent[hi];
  let r=e>>16&255,g=e>>8&255,b=e&255;
  if(lo&&blend){
    const nx=ent[hi===15?0:hi+1],f2=lo<<4,f1=255-f2;
    r=palScale8(r,f1)+palScale8(nx>>16&255,f2);
    g=palScale8(g,f1)+palScale8(nx>>8&255,f2);
    b=palScale8(b,f1)+palScale8(nx&255,f2);
  }
  return'#'+((r<<16|g<<8|b)>>>0).toString(16).padStart(6,'0');
}
const palObs=new ResizeObserver(es=>es.forEach(e=>e.target.isConnected?palPaint(e.target):palObs.unobserve(e.target)));
function palRamp(cls){
  const cv=el('canvas',{class:'ramp'+(cls?' '+cls:'')});
  palObs.observe(cv);
  return cv;
}
function palSet(cv,v,blend){
  cv._v={stops:v.stops.map(s=>({c:s.c,p:s.p})),placed:v.placed};
  cv._bl=blend;
  palPaint(cv);
}
function palPaint(cv){
  const w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h||!cv._v)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(w*dpr));
  cv.height=Math.max(1,Math.round(h*dpr));
  const ent=palTable(cv._v),g=cv.getContext('2d'),n=cv.width;
  for(let x=0;x<n;x++){
    g.fillStyle=palSample(ent,Math.round((n>1?x/(n-1):0)*240),cv._bl);
    g.fillRect(x,0,1,cv.height);
  }
}
function viewPalettes(view){
  let files={};
  let sel=null;
  let pend='';
  let pal=palNew();
  let selRef=null;
  let blend=true,mark='',dragging=false;
  const palKey=v=>(v.placed?'p:':'e:')+v.stops.map(s=>s.c+'@'+s.p).join(',');
  const dirty=()=>palKey(pal)!==mark;

  const list=el('div',{class:'pallist'});
  const listCount=el('span',{class:'ftcount'});
  const listHd=el('div',{class:'palhd',role:'button',tabindex:'0','aria-expanded':'false'},
                   el('h2',null,t('palettes')),listCount,
                   el('span',{class:'chev'},icon('chev')));
  const fold=open=>{
    listHd.parentNode.classList.toggle('open',open);
    listHd.setAttribute('aria-expanded',open?'true':'false');
  };
  pressable(listHd,()=>fold(!listHd.parentNode.classList.contains('open')));
  const nameIn=el('input',{type:'text',maxlength:'24',placeholder:t('name')});
  const count=el('span',{class:'palcount'});
  const prev=palRamp('big');
  const track=el('div',{class:'palhandles'});
  const bar=el('div',{class:'palbar'},prev,track);
  const note=el('div',{class:'palnote'});
  const colPick=colorPick('#FF0000',()=>setColor(colPick.get()));
  const colIn=colPick.input;
  colIn.setAttribute('aria-label',t('palstopcol'));
  const posIn=el('input',{type:'number',min:'0',max:'100',step:'1','aria-label':t('palstoppos')});
  const rmBtn=el('button',{class:'icon danger',title:t('palrmstop'),'aria-label':t('palrmstop')},'✕');
  const evenBtn=el('button',null,t('paleven'));
  const blendSw=mkSwitch(true,()=>{blend=blendSw.input.checked;paintPrev();});
  const newBtn=el('button',null,icon('plus'),' '+t('newpal'));
  const addBtn=el('button',null,icon('plus'),' '+t('paladd'));
  const tryBtn=el('button',null,t('tryit'));
  const saveBtn=el('button',{class:'pri'},t('save'));

  function load(kind,name,v,unsaved){
    sel=kind?{kind,name}:null;
    pend=kind?'':name;
    pal={stops:v.stops.map(s=>({c:s.c,p:s.p})),placed:v.placed};
    selRef=pal.stops[0];
    mark=unsaved?'':palKey(pal);
    paintEditor();
  }
  function guard(fn){
    if(!dirty()){fn();return;}
    toast(t('palunsaved'),false,[{label:t('discard'),fn},
                                 {label:t('save'),pri:true,fn:()=>save().then(ok=>{if(ok)fn();})}]);
  }
  function pick(kind,name){
    guard(()=>{
      const own=files[name.toLowerCase()];
      load(kind,name,kind==='builtin'&&(!own||own.bad)?palBuiltin(name):own.pal);
      paintList();fold(false);
    });
  }
  function dup(name,v){
    guard(()=>{
      let i=2,n=name+i;
      while(files[n.toLowerCase()]||palIsBuiltin(n))n=name+(++i);
      load(null,n,v,true);
      paintList();fold(false);
    });
  }

  function row(kind,name,v,over){
    const r=el('div',{class:'palrow'+(sel&&sel.kind===kind&&sel.name===name?' on':''),
                      role:'button',tabindex:'0'});
    const acts=el('div',{class:'acts'});
    if(v){
      const cp=el('button',{class:'icon',title:t('paldup'),'aria-label':t('paldup')},icon('copy'));
      cp.addEventListener('click',()=>dup(name,v));
      acts.append(cp);
    }
    if(kind==='user'||over){
      const lbl=over?t('palreset'):t('del');
      const rm=armable(el('button',{class:'icon danger',title:lbl,'aria-label':lbl},icon('trash')),
        async()=>{
          const f=files[name.toLowerCase()];
          try{
            await delFile('/PALETTES/'+f.file);
            toast(over?t('palrestored'):t('deleted'));
            await reload();
            if(sel&&sel.name===name){
              if(over)load('builtin',name,palBuiltin(name));
              else load(null,'',palNew());
            }
            paintList();
          }catch(e){toastErr(e);}
        });
      acts.append(rm);
    }
    const body=v?palRamp():el('div',{class:'palbad'},t('palbad'));
    if(v)palSet(body,v,true);
    r.replaceChildren(el('div',{class:'l1'},el('span',{class:'nm'},name),
                        over?el('span',{class:'tag'},t('paloverr')):null),
                      acts,body);
    if(v)pressable(r,e=>{if(!e.target.closest('button'))pick(kind,name);});
    return r;
  }
  function paintList(){
    const kids=[el('div',{class:'grp'},t('palbuiltin'))];
    PAL_BUILTIN.forEach(([n])=>{
      const own=files[n.toLowerCase()];
      kids.push(row('builtin',n,own&&!own.bad?own.pal:palBuiltin(n),!!own));
    });
    const mine=Object.keys(files).filter(k=>!palIsBuiltin(k)).sort().map(k=>files[k]);
    kids.push(el('div',{class:'grp'},t('palyours'),
                el('span',{class:'mono'},String(mine.length))));
    kids.push(...(mine.length?mine.map(f=>row('user',f.name,f.bad?null:f.pal,false))
                            :[el('div',{class:'empty'},t('palnone'))]));
    list.replaceChildren(...kids);
    listCount.replaceChildren(String(PAL_BUILTIN.length+mine.length));
  }

  function place(){
    if(pal.placed)return;
    const n=pal.stops.length;
    pal.stops.forEach((s,i)=>{s.p=Math.round(palEven(i,n));});
    pal.placed=true;
    evenBtn.disabled=false;
  }
  const posFromX=(clientX,rect)=>clamp(Math.round((clientX-rect.left)/Math.max(1,rect.width)*100),0,100);
  const sortStops=()=>pal.stops.sort((a,b)=>a.p-b.p);
  function addStop(p){
    const st={c:palSample(palTable(pal),Math.round(p/100*240),blend).toUpperCase(),p};
    place();
    pal.stops.push(st);
    sortStops();
    selRef=st;
  }

  function markSel(){
    const i=pal.stops.indexOf(selRef);
    [...track.children].forEach((h,j)=>h.classList.toggle('on',j===i));
  }

  function paintHandles(){
    track.replaceChildren(...pal.stops.map((s,i)=>{
      const h=el('button',{type:'button',class:'palh'+(s===selRef?' on':''),
                           style:'left:'+palPosOf(pal,i)+'%',
                           title:t('palstop')+' '+(i+1),
                           'aria-label':t('palstop')+' '+(i+1)+', '+Math.round(palPosOf(pal,i))+'%'},
                 el('i',{style:'background:'+s.c}));
      h.addEventListener('pointerdown',e=>{
        if(e.button)return;
        e.preventDefault();
        selRef=s;markSel();paintStop();
        const rect=bar.getBoundingClientRect();
        const start=palPosOf(pal,pal.stops.indexOf(s));
        let moved=false;
        onDrag(ev=>{
          const p=posFromX(ev.clientX,rect);
          if(!moved&&p===start)return;
          moved=dragging=true;
          place();
          s.p=p;
          h.style.left=p+'%';
          h.classList.add('drag');
          posIn.value=String(p);
          paintPrev();
        },()=>{
          if(moved){sortStops();paintHandles();paintStop();}
          setTimeout(()=>{dragging=false;},0);
        });
      });
      h.addEventListener('click',e=>{
        e.stopPropagation();
        if(s===selRef)return;
        selRef=s;markSel();paintStop();
      });
      h.addEventListener('keydown',e=>{
        const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
        if(!d)return;
        e.preventDefault();
        place();
        s.p=clamp(s.p+d*(e.shiftKey?10:1),0,100);
        sortStops();
        selRef=s;paintHandles();paintStop();paintPrev();
        const again=[...track.children][pal.stops.indexOf(s)];
        if(again)again.focus();
      });
      return h;
    }));
  }
  bar.addEventListener('click',e=>{
    if(dragging||e.target.closest('.palh'))return;
    if(pal.stops.length>=PAL_MAX){toast(t('palfull'),false);return;}
    addStop(posFromX(e.clientX,bar.getBoundingClientRect()));
    paintStops();
  });

  function paintStop(){
    const i=pal.stops.indexOf(selRef);
    if(i<0){selRef=pal.stops[0];return paintStop();}
    colPick.set(selRef.c);
    posIn.value=String(Math.round(palPosOf(pal,i)));
    rmBtn.disabled=pal.stops.length<2;
  }
  function setColor(hex){
    selRef.c=hex.toUpperCase();
    const i=pal.stops.indexOf(selRef);
    const h=[...track.children][i];
    if(h)h.firstChild.style.background=selRef.c;
    colPick.set(selRef.c);
    paintPrev();
  }
  posIn.addEventListener('input',()=>{
    const v=parseInt(posIn.value,10);
    if(!isFinite(v))return;
    place();
    selRef.p=clamp(v,0,100);
    sortStops();
    paintHandles();paintPrev();
  });
  rmBtn.addEventListener('click',()=>{
    if(pal.stops.length<2)return;
    const i=pal.stops.indexOf(selRef);
    pal.stops.splice(i,1);
    selRef=pal.stops[Math.min(i,pal.stops.length-1)];
    paintStops();
  });
  evenBtn.addEventListener('click',()=>{
    pal.placed=false;
    pal.stops.forEach(s=>{s.p=0;});
    paintStops();
  });
  addBtn.addEventListener('click',()=>{
    if(pal.stops.length>=PAL_MAX){toast(t('palfull'),false);return;}
    if(!pal.placed){
      pal.stops.push({c:pal.stops[pal.stops.length-1].c,p:0});
      selRef=pal.stops[pal.stops.length-1];
    }else{
      let at=0,gap=-1;
      for(let i=0;i+1<pal.stops.length;i++){
        const g=pal.stops[i+1].p-pal.stops[i].p;
        if(g>gap){gap=g;at=i;}
      }
      addStop(gap>0?Math.round((pal.stops[at].p+pal.stops[at+1].p)/2)
                   :Math.min(100,pal.stops[pal.stops.length-1].p+1));
    }
    paintStops();
  });

  function paintStops(){
    count.replaceChildren(pal.stops.length+'/'+PAL_MAX+' '+t('palstops'));
    count.classList.toggle('max',pal.stops.length>=PAL_MAX);
    evenBtn.disabled=!pal.placed;
    paintHandles();paintStop();paintPrev();
  }
  function paintPrev(){palSet(prev,pal,blend);}
  function paintSave(){
    const bi=sel&&sel.kind==='builtin';
    saveBtn.replaceChildren(bi?t('paloverride')
      :sel&&nameIn.value.trim()!==sel.name?t('palsaveas'):t('save'));
  }
  function paintEditor(){
    const bi=sel&&sel.kind==='builtin';
    nameIn.value=sel?sel.name:pend;
    nameIn.disabled=!!bi;
    note.replaceChildren(sel&&!bi?t('palownhelp'):'');
    paintSave();paintStops();
  }
  nameIn.addEventListener('input',paintSave);
  newBtn.addEventListener('click',()=>guard(()=>{
    load(null,'',palNew());
    paintList();fold(false);nameIn.focus();
  }));
  tryBtn.addEventListener('click',async()=>{
    const arr=pal.placed?pal.stops.map(s=>({color:s.c,pos:s.p})):pal.stops.map(s=>s.c);
    try{
      await post('/api/v1/notifications',
                 {text:'',durationMs:4000,effect:'Plasma',palette:arr,paletteBlend:blend});
      toast(t('shown'));
    }catch(e){toastErr(e);}
  });
  saveBtn.addEventListener('click',()=>save());

  async function save(){
    const name=nameIn.value.trim();
    if(!/^[A-Za-z0-9_-]{1,24}$/.test(name)){toast(t('palname'),false);return false;}
    const bi=palIsBuiltin(name);
    if(bi&&!(sel&&sel.kind==='builtin')){
      return new Promise(res=>{
        toast(bi+': '+t('palwillover'),false,
              [{label:t('cancel'),fn:()=>res(false)},
               {label:t('save'),pri:true,fn:()=>write(bi).then(res)}]);
      });
    }
    return write(bi||name);
  }
  async function write(name){
    saveBtn.disabled=true;
    try{
      await uploadFile(new Blob([palFileText(pal)],{type:'text/plain'}),'/PALETTES',name+'.txt',null);
      sel={kind:palIsBuiltin(name)?'builtin':'user',name};
      pend='';mark=palKey(pal);
      toast(t('palsaved'));
      await reload();
      paintEditor();
      return true;
    }catch(e){toastErr(e);return false;}
    finally{saveBtn.disabled=false;}
  }

  async function reload(){
    try{
      const{data}=await api('/api/v1/files?dir='+encodeURIComponent('/PALETTES'));
      const next={};
      await Promise.all((data.files||[]).filter(f=>/\.txt$/i.test(f.name)).map(async f=>{
        const base=f.name.replace(/\.txt$/i,'');
        try{
          const{text}=await api('/PALETTES/'+encodeURIComponent(f.name),{cache:'no-store'});
          const v=palParseFile(text);
          next[base.toLowerCase()]=v?{name:base,file:f.name,pal:v}
                                    :{name:base,file:f.name,bad:true};
        }catch(e){}
      }));
      files=next;
      paintList();
    }catch(e){toastErr(e);}
  }

  view.append(el('div',{class:'palwrap'},
    el('div',{class:'card palcard'},listHd,
      el('div',{class:'palbody'},
        el('div',{class:'ghelp'},t('palhelp')),
        list,
        el('div',{class:'row'},newBtn))),
    el('div',{class:'card'},
      el('h2',null,t('paledit')),
      el('div',{class:'palhead'},nameIn,count,
        el('span',{class:'palbl',title:t('palblendh')},
          el('span',{class:'mono'},t('palblend')),blendSw.node)),
      bar,
      el('div',{class:'palsel'},colPick.node,
        el('span',{class:'mono pl'},t('palstoppos')),posIn,
        el('span',{class:'grow'}),evenBtn,rmBtn),
      note,
      el('div',{class:'row palacts'},addBtn,el('span',{class:'grow'}),tryBtn,saveBtn))));
  load(null,'',palNew());
  reload();
}
function viewLog(view){
  const con=el('div',{class:'console'});
  let next=0,autoscroll=true,lines=[];
  con.addEventListener('scroll',()=>{
    autoscroll=con.scrollTop+con.clientHeight>=con.scrollHeight-8;
    asSw.input.checked=autoscroll;
  });
  const clearBtn=el('button',null,t('clear'));
  clearBtn.addEventListener('click',()=>{lines=[];con.replaceChildren();});
  const copyBtn=el('button',null,t('copy'));
  copyBtn.addEventListener('click',async()=>{await copyText(lines.join('\n'));toast(t('copied'));});
  const asSw=mkSwitch(true,()=>{autoscroll=asSw.input.checked;});
  view.append(el('div',{class:'card wide'},
    el('h2',null,t('log')),el('div',{class:'ghelp'},t('loghelp')),
    el('div',{class:'row'},clearBtn,copyBtn,el('span',{class:'grow'}),
      el('span',{class:'mono'},t('autoscroll')),asSw.node),
    con));
  poller(async()=>{
    const{data}=await api('/api/v1/logs?after='+next,{timeout:4000});
    if(!data||!Array.isArray(data.lines))return;
    next=data.next;
    if(data.lines.length){
      lines.push(...data.lines);
      if(lines.length>800){lines=lines.slice(-600);con.replaceChildren(lines.join('\n'));}
      else data.lines.forEach(l=>con.append(l+'\n'));
      if(autoscroll)con.scrollTop=con.scrollHeight;
    }
  },1000);
}
function viewFullscreen(){
  document.documentElement.classList.add('fs');
  const initial=displayGeometry();
  const cv=el('canvas',{id:'screen',width:initial.width*10,height:initial.height*10,role:'img','aria-label':t('livepre')});
  document.body.replaceChildren(cv);
  const ctx=cv.getContext('2d');
  let pw=initial.width,ph=initial.height;
  const fit=()=>{
    const sc=Math.max(1,Math.floor(Math.min(innerWidth/pw,innerHeight/ph)));
    if(cv.width!==pw*sc||cv.height!==ph*sc){cv.width=pw*sc;cv.height=ph*sc;}
    return sc;
  };
  addEventListener('resize',()=>fit());
  pollScreen((px,d)=>{pw=d.width;ph=d.height;paint(ctx,px,pw,ph,fit());},250);
}
if(/\/fullscreen\/?$/.test(location.pathname)){
  viewFullscreen();
}else{
paintTheme();
const topbar=$('.topbar');
const setChromeH=()=>document.documentElement.style.setProperty('--chrome-h',topbar.offsetHeight+'px');
setChromeH();
new ResizeObserver(setChromeH).observe(topbar);
(async()=>{
  try{
    const{data}=await api('/api/v1/device',{timeout:5000});
    setStats(data);
    S.ap=!data.ipAddress||data.ipAddress==='0.0.0.0';
  }catch(e){}
  render();
  try{
    const caps=(await api('/api/v1/capabilities')).data||{};
    if(!S.transitions.length)S.transitions=caps.transitions||[];
    readAudioCaps(caps);
    //linux:begin
    if(S.oauth&&/^#oauth(_error)?=/.test(location.hash))oauthReturn();
    //linux:end
    if(!anyAudioCap())nav();
  }catch(e){}
})();
}
})();
